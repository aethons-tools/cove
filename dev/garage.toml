# Garage for local dev (dev/docker-compose.yml): one node, the S3 API only.
# The rpc_secret comes from GARAGE_RPC_SECRET in the compose file (dev only).
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"             # Jam's blobs.region must match
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"   # virtual-host style; Jam uses path-style
