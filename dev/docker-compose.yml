# Dev instance assets for Jam.
#
# Raises a local PostgreSQL matching Jam's CI/integration conventions
# (see .github/workflows/store-integration.yml) — Jam auto-migrates on
# startup, so no init SQL is needed here — and Garage, an S3-compatible
# store for attachments (dev/README.md#attachments-garage).
#
#   docker compose -f dev/docker-compose.yml up -d   (or: just dev-up)
#
# Host port is 15432 (mapped to the container's 5432) to avoid clashing with
# any other local Postgres. Point the integration tests at it with:
#   export JAM_TEST_POSTGRES_DSN="host=localhost port=15432 dbname=jam user=jam password=jam sslmode=disable"
#   just integration-jam
#
# Jam itself is an opt-in service (profile "jam"), run from the container image:
#   just jam-image                                   (builds cove-jam:dev)
#   cp dev/jam.container.yml.example dev/jam.container.yml; cp dev/credentials.container.yml.example dev/credentials.container.yml
#   just dev-jam-up                                  (needs `just dev-cert` first)

name: jam-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: jam
      POSTGRES_PASSWORD: jam
      POSTGRES_DB: jam
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jam"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Attachments' blob store: Garage (AGPL-3.0, S3-compatible), one node. On
  # first start it lays itself out and creates the dev key and bucket below
  # (idempotent on restarts). S3 API on host port 13900.
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: "6a616d2d6465762d6f6e6c792d7270632d7365637265742d6e6f742d73656372"
      GARAGE_DEFAULT_ACCESS_KEY: GKjamdev0000000000000000
      GARAGE_DEFAULT_SECRET_KEY: jam-dev-secret-not-secret-0000000000000000
      GARAGE_DEFAULT_BUCKET: jam-attachments
    ports:
      - "13900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Jam, from the local image. Opt-in: only started with --profile jam
  # (just dev-jam-up). Cove-facing TLS on 8443 (published as 443); admin on
  # 8081, published to host loopback only.
  jam:
    profiles: ["jam"]
    image: ${JAM_IMAGE:-cove-jam:dev}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    ports:
      - "443:8443"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./jam.container.yml:/etc/jam/jam.yml:ro
      - ./credentials.container.yml:/etc/jam/credentials.yml:ro
      - ${JAM_TLS_DIR:-./tls}:/etc/jam/tls:ro
      - jamstate:/var/lib/jam

volumes:
  pgdata:
  garagemeta:
  garagedata:
  jamstate:
