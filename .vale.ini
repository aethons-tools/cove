# Vale, for the books' prose: scripts/vale.sh runs it (`just vale`, and the
# gate on the pages a pull request changes). See docs/modules/ROOT/pages/manual-vale.adoc.
StylesPath = styles
MinAlertLevel = suggestion
# The word list: styles/config/vocabularies/Jam/accept.txt.
Vocab = Jam

# The pages: the AsciiDoc under manual/ and docs/ (scripts/vale.sh leaves out
# docs/superpowers/). Vale.Spelling checks American English, its default.
[*.adoc]
BasedOnStyles = Vale, Google, Jam
Google.OxfordComma = error
