<style>
/* Tokens and base: jam.css (shared with /app/admin). Intercom components below. */
html,body{height:100%}
body{display:flex;flex-direction:column}
.app-titlebar{flex:0 0 auto}
.mono,.cove,.tkt{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.panes{flex:1 1 auto;display:grid;grid-template-columns:320px 1fr;min-height:0}
.rail{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);min-height:0}
.rail-list{flex:1 1 auto;overflow-y:auto;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex:0 0 auto}
.newmsg{position:relative}
.newmsg summary{cursor:pointer;list-style:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:8px}
.newmsg[open] summary{background:var(--accent-soft)}
.recips{position:absolute;top:100%;right:0;z-index:30;min-width:230px;margin-top:6px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.recips button{text-align:left;background:none;border:0;font:inherit;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer}
.recips button:hover{background:var(--surface-2)}
.recips .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.group{padding:6px 10px 4px}
.group-h{display:flex;align-items:center;gap:8px;padding:10px 8px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.group-h .count{margin-left:auto}
.group.attention .group-h{color:var(--wait)}
.thread{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid transparent}
.thread:hover{background:var(--surface-2)}
.thread.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.thread .pin{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pin.wait{background:var(--wait);box-shadow:0 0 0 3px var(--wait-soft)}
.pin.live{background:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.pin.chan{background:var(--faint);border-radius:2px}
.thread .cove{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge.unread{background:var(--accent);color:#fff;min-width:18px;text-align:center}
.empty{color:var(--faint);font-size:13px;padding:14px}
.convo{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.cv-empty{flex:1;display:grid;place-items:center;color:var(--faint)}
.cv-readonly{padding:10px 16px;color:var(--faint);border-top:1px solid var(--border)}
.cv-head{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cv-title{font-weight:600;font-size:15px}
.cv-sub{color:var(--muted);font-size:12.5px}
.cv-head .spacer{flex:1}
.cv-head .callin{display:inline-flex;gap:6px;align-items:center}
.cv-head .callin select,.cv-head button{font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--wait-line);background:var(--wait-soft);color:var(--wait)}
.stream{flex:1;overflow-y:auto;min-height:0;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:76%;display:flex;flex-direction:column;gap:4px}
.msg .from{font-size:11.5px;color:var(--faint);font-weight:600;padding:0 4px;position:relative}
/* Copy controls: shown on hover or keyboard focus (always on touch screens).
   The bubble's pair sits beside the sender, outside the bubble's box so it never
   resizes it; a code block's button floats over its top-right corner. */
.msg .acts{position:absolute;top:50%;transform:translateY(-50%);left:100%;display:flex;gap:4px;margin-left:4px;white-space:nowrap}
.msg.human .acts{left:auto;right:100%;margin:0 4px 0 0}
.msg.agent .from{align-self:flex-start}
.msg .acts button,.codebox .copy-code{font:inherit;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 7px;cursor:pointer}
.msg .acts button:hover,.codebox .copy-code:hover{color:var(--accent);border-color:var(--accent)}
.msg .acts button.copied::after{content:" ✓"}
.msg .acts,.codebox .copy-code{opacity:0;transition:opacity .12s}
.msg:hover .acts,.msg .acts:has(:focus-visible),.codebox:hover .copy-code,.codebox .copy-code:focus-visible{opacity:1}
@media (hover:none){.msg .acts,.codebox .copy-code{opacity:1}}
.codebox{position:relative}
.codebox>pre{margin:0}
.codebox .copy-code{position:absolute;top:5px;right:5px;padding:3px 5px;line-height:0}
.codebox .copy-code .ok,.codebox .copy-code.copied .cp{display:none}
.codebox .copy-code.copied .ok{display:inline}
/* max-width caps the body at its bubble: a right-aligned (human) body is sized
   to its content, not stretched, so a wide code block would otherwise spill out
   of the bubble instead of scrolling inside its own pre (overflow-x:auto below). */
.msg .body{padding:10px 13px;border-radius:13px;word-break:break-word;max-width:100%}
.msg .body.plain{white-space:pre-wrap}
/* Each bubble also carries its body as sent, hidden: what Markdown copies. */
.msg .body.raw{display:none}
.msg .body.md>:first-child{margin-top:0}.msg .body.md>:last-child{margin-bottom:0}
.msg .body.md p,.msg .body.md ul,.msg .body.md ol,.msg .body.md pre,.msg .body.md .codebox,.msg .body.md blockquote,.msg .body.md table{margin:0 0 .6em}
.msg .body.md ul,.msg .body.md ol{padding-left:1.3em}
.msg .body.md code{font:12.5px "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}
.msg .body.md pre{overflow-x:auto;background:rgba(127,127,127,.12);padding:8px 10px;border-radius:8px}
.msg .body.md pre code{background:none;padding:0}
.msg .body.md blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--faint)}
.msg .body.md table{border-collapse:collapse}.msg .body.md th,.msg .body.md td{border:1px solid var(--border);padding:3px 8px}
.msg .body.md a{color:inherit;text-decoration:underline}
.msg.agent{align-self:flex-start}
.msg.agent .body{background:var(--agent-bubble);border-top-left-radius:4px}
.msg.human{align-self:flex-end;align-items:flex-end}
.msg.human .body{background:var(--human-bubble);border-top-right-radius:4px}
.msg .t{font-size:10.5px;color:var(--faint);padding:0 4px}
/* Presence strip: each session's status under the messages, typing-indicator
   style. Busy sessions get animated dots; idle and paused ones are dimmed. */
.presence{padding:0 20px 10px;display:flex;flex-direction:column;gap:3px}
.presence:empty{display:none}
.sess{font-size:12px;color:var(--muted)}
.sess .sname{font-weight:600;color:var(--ink)}
.sess b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:500}
.sess.dim{opacity:.55}
.sess.wait,.sess.wait .sname{color:var(--wait)}
.sess .dots,.te-working .dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.sess .dots i,.te-working .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:meDot 1.2s infinite ease-in-out}
.sess .dots i:nth-child(2),.te-working .dots i:nth-child(2){animation-delay:.15s}
.sess .dots i:nth-child(3),.te-working .dots i:nth-child(3){animation-delay:.3s}
@keyframes meDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.sess .dots i,.te-working .dots i{animation:none;opacity:.6}}
.composer{border-top:1px solid var(--border);background:var(--surface);padding:12px 20px}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;padding:10px 12px;resize:none;min-height:42px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer .draft-chip{display:inline-block;margin:0 0 8px;font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.composer .draft-chip[hidden]{display:none}
.composer .send-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.composer .send-col button kbd{font:inherit;font-size:11px;font-weight:500;opacity:.75;margin-left:4px}
.composer .plain-opt{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.composer button{background:var(--accent);color:#fff;border:0;border-radius:9px;font:inherit;font-weight:600;padding:9px 18px;cursor:pointer}
@media (max-width:720px){.panes{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.rail{border-right:0;border-bottom:1px solid var(--border)}.rail-list{display:none}.rail-head{border-bottom:0}}
.askcard{border:1px solid var(--wait-line);background:var(--wait-soft);border-radius:10px;padding:10px 12px;margin:8px 0;max-width:640px}
.askcard.answered,.askcard.withdrawn{background:transparent;border-color:var(--line,#ddd)}
.ask-q{font-weight:600;margin-bottom:6px}.ask-q .edited,.for{font-weight:400;font-size:11.5px;opacity:.7}
.ask-form{display:flex;flex-wrap:wrap;gap:6px}.ask-form button small{display:block;font-size:11px;opacity:.75}
.ask-form textarea{flex-basis:100%;min-height:2.4em}.ask-opts span{margin-right:8px;opacity:.8}
.discuss{margin-top:6px;font-size:12px}.sysline{font-size:12px;opacity:.75;margin:4px 0;text-align:center}
.re-ask{display:inline-block;font-size:11.5px;margin-bottom:3px}.asks-panel{padding:6px 12px;border-bottom:1px solid var(--line,#ddd)}
.asks-panel .ask-link{display:block;font-size:13px}.badge.asks{background:var(--wait-soft);color:var(--wait)}
.att-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}.att-chips:empty{display:none}
.att-chip{font-size:12px;border:1px solid var(--line,#ddd);border-radius:999px;padding:2px 8px}.att-chip.failed{color:#b00}
.att-chip progress{width:60px;height:6px;vertical-align:middle}.att-chip button{border:0;background:none;cursor:pointer}
.attach-btn{cursor:pointer;margin-right:6px}.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.thumb img{max-width:240px;max-height:180px;border-radius:6px;display:block}.file-chip{font-size:13px;border:1px solid var(--line,#ddd);border-radius:6px;padding:4px 8px}
.board-card{border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 10px;margin:8px 0;max-width:520px}
.board-card img{max-width:100%;max-height:260px;display:block;border-radius:6px;margin:6px 0;background:#fff}
.board-title{font-weight:600}.board-open{font-size:13px}
.board-pane{display:flex;flex-direction:column;flex:1;min-height:0}
.board-bar{padding:6px 12px;border-bottom:1px solid var(--line,#ddd);display:flex;gap:10px;align-items:center}
#board-editor{flex:1;min-height:480px;position:relative}#board-editor .wb-canvas{position:absolute;inset:0}
.wb-error{color:#b00;padding:8px}.wb-banner{position:absolute;top:0;left:50%;z-index:10;background:#fff}
.session-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.session-head .sh-kind,.session-head .sh-ticket{font-size:11.5px;border:1px solid var(--border-strong);border-radius:999px;padding:1px 7px;color:var(--muted)}
.session-head .sh-sub,.session-head .t{color:var(--muted);font-size:12.5px}
.session-head .sh-tabs button,.session-head .sh-ssh{background:none;border:1px solid var(--border-strong);border-radius:6px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer}
.session-head .sh-tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.session-head .sh-more{position:relative}.session-head .sh-more summary{list-style:none;cursor:pointer;padding:2px 8px}
.session-head .sh-more .menu{position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:20}

.cv-split{flex:1;min-height:0;display:flex}
.cv-split[data-place="below"]{flex-direction:column}
.cv-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.side-pane{flex:0 0 380px;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.cv-split[data-place="below"] .side-pane{flex-basis:280px}
.pane-div{flex:0 0 5px;cursor:col-resize;background:var(--border);touch-action:none}

.sp-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border)}

.sp-body:has(> .th){display:flex;flex-direction:column;overflow:hidden}

.th-bar{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}

.th-chips{display:inline-flex;gap:4px;flex-wrap:wrap}

.th-chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.th-search{flex:1;min-width:90px}
.th-list{flex:1;min-height:0;overflow:auto;font:12.5px/1.45 ui-monospace,monospace}
.te-line{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.te-icon{display:inline-block;width:1.4em;color:var(--muted)}

.k-other .te-line,.k-other .te-icon,.k-thinking.te-empty .te-text{color:var(--faint);cursor:default}
.k-prompt .te-text{font-weight:600}
.te.te-absorbed{display:none}
.te.err .te-status{color:var(--wait)}

.te-detail,.te-out,.te-raw{white-space:pre-wrap;word-break:break-word;margin:2px 0 6px 18px;max-height:none;font:inherit;padding:4px 6px;background:var(--surface-2);border-radius:4px}
.te-detail,.te-out,.te-note,.te-raw{display:none}
.te.open .te-detail,.te.open .te-out,.te.open .te-note,.fmt-detailed .te-detail,.fmt-detailed .te-out,.fmt-detailed .te-note{display:block}

.th-list.hide-thinking .k-thinking,.th-list.hide-text .k-text,.th-list.hide-text .k-prompt,.th-list.hide-tools .k-tool_call,.th-list.hide-tools .k-tool_result{display:none}
.th-list:not(.show-progress) .k-progress{display:none}
.th-list.only-errors .k-tool_call:not(.err),.th-list.only-errors .k-tool_result:not(.err){display:none}
.th-list .te.tool-miss:not(.k-gap),.th-list .te.search-miss:not(.k-gap){display:none}
.th-new{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:inherit;font-size:12px;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:3px 12px;box-shadow:0 4px 12px rgba(0,0,0,.18)}

   swapped pane body) and a preview's View here. */

.st-bar .spacer{flex:1}
.st-status{color:var(--muted)}
.st-bar button{font:inherit;font-size:12px;cursor:pointer;background:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:inherit}

.st-iframe{flex:1;width:100%;height:100%;border:0;background:#fff}
.sp-row:has(+ .pv-here){display:inline-block;width:calc(100% - 90px);vertical-align:middle}

<script src="/app/static/htmx.min.js"></script>
<script>
// meSelecting reports a non-empty text selection touching #stream. It filters
// the stream's refresh: swapping the list would replace the selected text nodes
// and the browser would drop the selection before it could be copied.
// meAnswering: an ask's comment box in the stream is focused or has text, so
// a refresh would wipe a half-typed answer.
function meAnswering(){
  var s=document.getElementById('stream'); if(!s) return false;
  var ts=s.querySelectorAll('.ask-form textarea');
  for(var i=0;i<ts.length;i++){ if(ts[i].value || ts[i]===document.activeElement) return true; }
  return false;
}
function meSelecting(){
  var sel=window.getSelection(), s=document.getElementById('stream');
  return !!(sel && s && !sel.isCollapsed && sel.rangeCount>0 && sel.getRangeAt(0).intersectsNode(s));
}
// Stick to the bottom: a #stream swap (a live-push/poll refresh, or the refresh after a
// send) keeps the old scrollTop, so a new squawk would land below the fold.
// Note before the swap whether the view was at the end (within a few px, for
// fractional scroll offsets); if so, scroll to the new end after it. A viewer
// scrolled up into history is left where they are.
document.addEventListener('htmx:beforeSwap', function(e){
  var s=e.detail.target;
  if(s && s.id==='stream'){ s._atBottom = s.scrollHeight - s.scrollTop - s.clientHeight < 16; }
});
document.addEventListener('htmx:afterSwap', function(e){
  var s=e.detail.target;
  if(s && s.id==='stream'){ meCodeButtons(s); }
  if(s && s.id==='stream' && s._atBottom){ meScrollToEnd(s, 'smooth'); }
});
// meScrollToEnd scrolls the message list s (if any) to its last message.

function meThCosts(){

    var c=n.querySelector('.te-cost'), cost=c ? parseFloat(c.dataset.cost)||0 : 0, ms=c ? +c.dataset.ms||0 : 0;

// meThCap keeps the newest meThMax lines, offering the rest as a page

function meThPage(stream, before, from, node, done){

   .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })

// Framed views: the Studio tab's IDE and a preview's View here, each a record

// A framed page reports a refusal with postMessage {jam:'frame-error',
// status}; anything can post one, so it is heeded only from the current
// iframe's own window, and only ever re-mints that view's own name: once on
// "signin" or "cookies" per user action (open, Reload, View here, Reopen).

   .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
   .then(function(j){

     if(j.open && /^https?:\/\//i.test(j.open)) rec.open.href=j.open;
     if(!/^https?:\/\//i.test(String(j.url))){ meFrameSay(rec, meFrameRefused()); return; }
     meFrameLoad(rec, j.url);
   })
   .catch(function(s){

function meFrameLoad(rec, url){

function meCompose(to, label){

    +'<div class="stream"><p class="empty">New conversation with '+label+'.</p></div>'
    +'<div class="composer"><form onsubmit="return meSend(event, this.dataset.to)" data-to="'+to+'">'
    +'<textarea name="body" placeholder="Message '+label+'… (⌘↵ to send · ⇧⌘V pastes as code · ⌘↓ stacks a draft)" required></textarea>'
    +'<div class="send-col"><label class="plain-opt" title="Send as plain text: shown literally, not rendered as markdown"><input type="checkbox" name="plain"> Plain text</label><button type="submit">Send <kbd>⌘↵</kbd></button></div></form></div>';

// Draft stack: Cmd-Down (Ctrl-Down off the Mac) pushes the composer's draft onto
// a per-conversation stack and clears the box, so another message can be
// written and sent first; a successful send pops the top draft back, cursor
// restored. Cmd-Up, or the chip above the box, pops by hand. A pop never
// overwrites text in the box, and on an empty box (push) or a non-empty one
// (pop) the keys keep their usual cursor moves. The stack lives in this tab's
// sessionStorage (it survives switching conversations and reloads, including
// dev live-reload), falling back to memory when storage is unavailable; it is
// never sent anywhere.
function meDraftKey(form){ return 'me-drafts:'+(form.dataset.to||''); }
function meDrafts(form){
  try{ return JSON.parse(sessionStorage.getItem(meDraftKey(form))||'[]'); }
  catch(_){ return form._drafts||[]; }
}
function meSaveDrafts(form, d){
  form._drafts=d;
  try{ sessionStorage.setItem(meDraftKey(form), JSON.stringify(d)); }catch(_){}
  meDraftChip(form);
}
function meDraftChip(form){
  if(!form) return;
  var chip=form.parentNode.querySelector('.draft-chip');
  if(!chip){
    chip=document.createElement('button');
    chip.type='button'; chip.className='draft-chip';
    chip.title='Restore the top stacked draft (⌘↑) — the box must be empty';
    chip.onclick=function(){ mePopDraft(form); };
    form.parentNode.insertBefore(chip, form);
  }

function mePushDraft(form){
  var t=form.body, text=t.value;
  if(!text.trim()) return false;
  var d=meDrafts(form);
  d.push({text:text, sel:t.selectionStart});
  meSaveDrafts(form, d);
  t.value=''; t.focus();
  meKeepReply(t);
  return true;
}
function mePopDraft(form){
  var t=form.body;
  if(t.value.trim()) return false;
  var d=meDrafts(form), top=d.pop();
  if(!top) return false;

  var s=Math.min(top.sel, top.text.length); t.setSelectionRange(s, s);

// Reply persistence: the text in a conversation's reply box is kept per
// recipient in this tab's sessionStorage as it is typed (like the draft stack),
// so leaving the conversation (a full page load) and coming back restores it.
// Emptying the box or a successful send forgets it. Code that sets the box's
// value directly (no input event) calls meKeepReply itself.
function meReplyKey(form){ return 'me-reply:'+(form.dataset.to||''); }
function meKeepReply(t){
  try{
    if(t.value){ sessionStorage.setItem(meReplyKey(t.form), t.value); }
    else{ sessionStorage.removeItem(meReplyKey(t.form)); }
  }catch(_){}
}
function meRestoreReply(form){
  if(!form || form.body.value) return;
  try{ form.body.value=sessionStorage.getItem(meReplyKey(form))||''; }catch(_){}
}
document.addEventListener('input', function(e){
  var t=e.target;
  if(t.matches && t.matches('.composer textarea')){ meKeepReply(t); }
});
document.addEventListener('keydown', function(e){
  var t=e.target;
  if(!t.matches || !t.matches('.composer textarea')) return;

  if(!(mac ? e.metaKey : e.ctrlKey) || e.shiftKey || e.altKey) return;

  else if(e.key==='ArrowUp' && mePopDraft(t.form)){ e.preventDefault(); }
});
document.querySelectorAll('.composer form').forEach(function(f){ meRestoreReply(f); meDraftChip(f); });
// Copy controls. meCopy writes text to the clipboard (the async API where the
// page is a secure context, else a hidden textarea and execCommand) and flashes
// a ✓ on the button that asked.
function meCopy(text, btn){
  function done(){ btn.classList.add('copied'); clearTimeout(btn._t); btn._t=setTimeout(function(){ btn.classList.remove('copied'); }, 1200); }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done); return; }

  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';

// meCopyBubble copies a whole message: as markdown, its body exactly as sent
// (the hidden .body.raw); as text, what the rendered bubble shows.
function meCopyBubble(btn, markdown){
  var m=btn.closest('.msg');
  if(markdown){ var r=m.querySelector('.body.raw'); meCopy(r?r.textContent:'', btn); return; }
  var b=m.querySelector('.body:not(.raw)'), text=b?b.innerText:'';

// meCodeButtons gives each code block under root a copy button, in a wrapper
// so the button stays put while the block scrolls sideways. The markdown HTML
// comes from the server renderer, so this runs on load and after each #stream
// swap. The button is icon-only: no text of its own to leak into a bubble's
// "Text" copy.
function meCodeButtons(root){
  root.querySelectorAll('.msg .body.md pre').forEach(function(pre){
    if(pre.parentNode.classList.contains('codebox')) return;
    var box=document.createElement('div'), b=document.createElement('button');
    box.className='codebox';
    b.type='button'; b.className='copy-code'; b.title='Copy code'; b.setAttribute('aria-label', 'Copy code');
    b.innerHTML='<svg class="cp" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>'
      +'<svg class="ok" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
    b.onclick=function(){ meCopy(pre.textContent.replace(/\n$/, ''), b); };
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(pre); box.appendChild(b);
  });
}
meCodeButtons(document);
</script>
