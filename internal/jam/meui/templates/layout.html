{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jam Intercom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#fff; --surface-2:#FBF9FA; --ink:#1B1D24; --muted:#61656F; --faint:#8A8F9A;
  --border:#E3E5EA; --border-strong:#D2D5DC; --accent:#B5306A; --accent-soft:#FBEAF1;
  --wait:#9C5E00; --wait-soft:#FBF0DC; --wait-line:#E6A93B; --live:#1A7F58; --live-soft:#E1F1E9;
  --idle:#6E7686; --idle-soft:#EDEEF1; --agent-bubble:#F1F2F5; --human-bubble:#FBEAF1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1116; --surface:#171A21; --surface-2:#1C1F27; --ink:#E8EAEE; --muted:#A0A5B0; --faint:#757B87;
  --border:#262A33; --border-strong:#333844; --accent:#E86AA0; --accent-soft:#34202B;
  --wait:#E8B15A; --wait-soft:#322914; --wait-line:#B98A2E; --live:#4FC28C; --live-soft:#17281F;
  --idle:#8B93A3; --idle-soft:#23262F; --agent-bubble:#1F232B; --human-bubble:#34202B; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mono,.cove,.tkt{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.brand small{color:var(--faint);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.panes{flex:1 1 auto;display:grid;grid-template-columns:320px 1fr;min-height:0}
.rail{border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px}
.rail-head b{font-size:13px}
.newmsg{position:relative}
.newmsg summary{cursor:pointer;list-style:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:8px}
.newmsg[open] summary{background:var(--accent-soft)}
.recips{position:absolute;top:100%;right:0;z-index:30;min-width:230px;margin-top:6px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.recips button{text-align:left;background:none;border:0;font:inherit;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer}
.recips button:hover{background:var(--surface-2)}
.recips .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.group{padding:6px 10px 4px}
.group-h{display:flex;align-items:center;gap:8px;padding:10px 8px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.group-h .count{margin-left:auto}
.group.attention .group-h{color:var(--wait)}
.thread{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid transparent}
.thread:hover{background:var(--surface-2)}
.thread.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.thread .pin{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pin.wait{background:var(--wait);box-shadow:0 0 0 3px var(--wait-soft)}
.pin.live{background:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.pin.chan{background:var(--faint);border-radius:2px}
.thread .cove{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge.unread{background:var(--accent);color:#fff;min-width:18px;text-align:center}
.empty{color:var(--faint);font-size:13px;padding:14px}
.convo{display:grid;grid-template-rows:auto 1fr auto;min-height:0;background:var(--bg)}
.cv-empty{display:grid;place-items:center;color:var(--faint)}
.cv-head{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cv-title{font-weight:600;font-size:15px}
.cv-sub{color:var(--muted);font-size:12.5px}
.cv-head .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--wait-line);background:var(--wait-soft);color:var(--wait)}
.stream{overflow-y:auto;min-height:0;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:76%;display:flex;flex-direction:column;gap:4px}
.msg .from{font-size:11.5px;color:var(--faint);font-weight:600;padding:0 4px}
.msg .body{padding:10px 13px;border-radius:13px;word-break:break-word}
.msg .body.plain{white-space:pre-wrap}
.msg .body.md>:first-child{margin-top:0}.msg .body.md>:last-child{margin-bottom:0}
.msg .body.md p,.msg .body.md ul,.msg .body.md ol,.msg .body.md pre,.msg .body.md blockquote,.msg .body.md table{margin:0 0 .6em}
.msg .body.md ul,.msg .body.md ol{padding-left:1.3em}
.msg .body.md code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}
.msg .body.md pre{overflow-x:auto;background:rgba(127,127,127,.12);padding:8px 10px;border-radius:8px}
.msg .body.md pre code{background:none;padding:0}
.msg .body.md blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--faint)}
.msg .body.md table{border-collapse:collapse}.msg .body.md th,.msg .body.md td{border:1px solid var(--border);padding:3px 8px}
.msg .body.md a{color:inherit;text-decoration:underline}
.msg.agent{align-self:flex-start}
.msg.agent .body{background:var(--agent-bubble);border-top-left-radius:4px}
.msg.human{align-self:flex-end;align-items:flex-end}
.msg.human .body{background:var(--human-bubble);border-top-right-radius:4px}
.msg .t{font-size:10.5px;color:var(--faint);padding:0 4px}
.composer{border-top:1px solid var(--border);background:var(--surface);padding:12px 20px}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;resize:none;min-height:42px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer .draft-chip{display:inline-block;margin:0 0 8px;font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.composer .draft-chip[hidden]{display:none}
.composer .send-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.composer .plain-opt{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.composer button{background:var(--accent);color:#fff;border:0;border-radius:9px;font:inherit;font-weight:600;padding:9px 18px;cursor:pointer}
@media (max-width:720px){.panes{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><span class="dot"></span>Jam <small>Intercom</small></span>
  <span class="spacer"></span>
  <details class="newmsg" id="newmsg">
    <summary>New message</summary>
    <div class="recips">
      {{range .Recipients}}
        <button type="button" onclick="meCompose('{{.To}}', '{{.Label}}')">{{.Label}}<span class="k">{{.Kind}}</span></button>
      {{else}}
        <p class="empty">No active recipients.</p>
      {{end}}
    </div>
  </details>
  <span class="who"><span class="av">{{if .Me}}{{slice .Me 0 1}}{{else}}?{{end}}</span> <span>{{.Me}}</span></span>
</header>
<div class="panes">
{{template "content" .}}
</div>
<script src="/me/static/htmx.min.js"></script>
<script>
// meSelecting reports a non-empty text selection touching #stream. It filters
// the stream's refresh: swapping the list would replace the selected text nodes
// and the browser would drop the selection before it could be copied.
function meSelecting(){
  var sel=window.getSelection(), s=document.getElementById('stream');
  return !!(sel && s && !sel.isCollapsed && sel.rangeCount>0 && sel.getRangeAt(0).intersectsNode(s));
}
// Stick to the bottom: a #stream swap (a live-push/poll refresh, or the refresh after a
// send) keeps the old scrollTop, so a new squawk would land below the fold.
// Note before the swap whether the view was at the end (within a few px, for
// fractional scroll offsets); if so, scroll to the new end after it. A viewer
// scrolled up into history is left where they are.
document.addEventListener('htmx:beforeSwap', function(e){
  var s=e.detail.target;
  if(s && s.id==='stream'){ s._atBottom = s.scrollHeight - s.scrollTop - s.clientHeight < 16; }
});
document.addEventListener('htmx:afterSwap', function(e){
  var s=e.detail.target;
  if(s && s.id==='stream' && s._atBottom){ meScrollToEnd(s, 'smooth'); }
});
// meScrollToEnd scrolls the message list s (if any) to its last message.
function meScrollToEnd(s, behavior){
  if(s){ s.scrollTo({top: s.scrollHeight, behavior: behavior || 'auto'}); }
}
// Opening a conversation is a full page load: start at its end.
meScrollToEnd(document.getElementById('stream'));
// Live push: /me/events sends a payload-free `changed` on each intercom-log
// append; fire meChanged so the rail and the open conversation refetch their
// own fragments (the 30s poll is the fallback, e.g. for a session going
// Waiting, which appends nothing). A push that arrives while text in #stream is
// selected is held and replayed once the selection clears; a REconnect fires
// one too, to catch up on anything missed while the stream was down. A server
// without live push answers 204, which stops EventSource for good.
(function(){
  if(!window.EventSource) return;
  var pending=false, connected=false;
  function changed(){
    if(meSelecting()){ pending=true; return; }
    pending=false;
    htmx.trigger(document.body, 'meChanged');
  }
  var es=new EventSource('/me/events');
  es.addEventListener('changed', changed);
  es.addEventListener('open', function(){ if(connected){ changed(); } connected=true; });
  document.addEventListener('selectionchange', function(){ if(pending && !meSelecting()){ changed(); } });
})();
function meSend(e, to){
  e.preventDefault();
  var f=e.target, body=(f.body.value||"").trim();
  if(!body) return false;
  fetch('/me/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:to,body:body,
    // Markdown is the default; the per-message "Plain text" box opts out.
    content_type: f.plain && f.plain.checked ? 'text/plain' : undefined})})
   .then(function(r){
     if(r.status===204){
       f.reset();
       mePopDraft(f);
       // Refresh only the message list of an open conversation; the rail's own
       // live-push refresh picks up a brand-new channel. Never re-render the composer.
       var s=document.getElementById('stream');
       // A send always ends at the bottom, wherever the view was: scroll once
       // this refresh has swapped (not on the next swap, which a push/poll refresh
       // without the new message could win).
       if(s){ htmx.ajax('GET','/me/stream?c='+encodeURIComponent(to),{target:'#stream',swap:'innerHTML'}).then(function(){ meScrollToEnd(s, 'smooth'); }); }
     } else { alert('Send failed ('+r.status+')'); }
   });
  return false;
}
// Composer keys: Enter inserts a newline as usual, but a second consecutive
// Enter sends (dropping the newline the first one added). Shift+Enter always
// inserts a newline and never arms the send, so deliberate blank lines are
// possible. Delegated on document so it covers htmx-swapped and meCompose
// composers alike.
document.addEventListener('keydown', function(e){
  var t=e.target;
  if(!t.matches || !t.matches('.composer textarea')) return;
  if(e.key!=='Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey || e.isComposing){
    t._enterArmed=false;
    return;
  }
  var i=t.selectionStart;
  if(t._enterArmed && i===t.selectionEnd && t.value.charAt(i-1)==='\n'){
    e.preventDefault();
    t._enterArmed=false;
    t.value=t.value.slice(0,i-1)+t.value.slice(i);
    t.form.requestSubmit();
    return;
  }
  t._enterArmed=true;
});
// meFence returns a backtick fence longer than any backtick run in s (at least
// three), so pasted text that has its own fences stays inside the block.
function meFence(s){
  var longest=0, run=0;
  for(var i=0;i<s.length;i++){ if(s[i]==='`'){ run++; if(run>longest){ longest=run; } } else { run=0; } }
  return '`'.repeat(Math.max(3, longest+1));
}
// Paste as code: Cmd-Shift-V (Ctrl-Shift-V off the Mac; on the Mac also
// Cmd-Alt-Shift-V, Safari's "Paste and Match Style") wraps what is pasted in a
// fenced code block on its own lines. These are the browsers' own
// paste-as-plain-text shortcuts — a no-op distinction in a plain textarea — so
// they fire a real paste event, whose clipboardData needs no permission prompt
// in any browser. The keydown marks the box (any other keydown clears it, so a
// later plain paste stays plain); the paste handler does the wrapping, via
// execCommand so Cmd-Z undoes it.
document.addEventListener('keydown', function(e){
  var t=e.target;
  if(!t.matches || !t.matches('.composer textarea')) return;
  var mac=/Mac|iPhone|iPad/.test(navigator.platform);
  t._pasteAsCode = e.code==='KeyV' && e.shiftKey && (mac ? e.metaKey : (e.ctrlKey && !e.altKey));
});
document.addEventListener('paste', function(e){
  var t=e.target;
  if(!t.matches || !t.matches('.composer textarea') || !t._pasteAsCode) return;
  t._pasteAsCode=false;
  var text=e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  if(!text) return;
  e.preventDefault();
  var f=meFence(text), before=t.value.slice(0, t.selectionStart);
  var block=(before && before.slice(-1)!=='\n' ? '\n' : '') + f + '\n' + text + (text.slice(-1)==='\n' ? '' : '\n') + f + '\n';
  if(!document.execCommand('insertText', false, block)){ t.setRangeText(block, t.selectionStart, t.selectionEnd, 'end'); }
});
function meCompose(to, label){
  var pane=document.getElementById('pane');
  pane.innerHTML='<div class="cv-head"><div class="cv-title">New message</div><div class="cv-sub">to '+label+'</div></div>'
    +'<div class="stream"><p class="empty">New conversation with '+label+'.</p></div>'
    +'<div class="composer"><form onsubmit="return meSend(event, this.dataset.to)" data-to="'+to+'">'
    +'<textarea name="body" placeholder="Message '+label+'… (Enter twice to send · ⇧⌘V pastes as code · ⌘↓ stacks a draft)" required></textarea>'
    +'<div class="send-col"><label class="plain-opt" title="Send as plain text: shown literally, not rendered as markdown"><input type="checkbox" name="plain"> Plain text</label><button type="submit">Send</button></div></form></div>';
  meDraftChip(pane.querySelector('.composer form'));
}
// Draft stack: Cmd-Down (Ctrl-Down off the Mac) pushes the composer's draft onto
// a per-conversation stack and clears the box, so another message can be
// written and sent first; a successful send pops the top draft back, cursor
// restored. Cmd-Up, or the chip above the box, pops by hand. A pop never
// overwrites text in the box, and on an empty box (push) or a non-empty one
// (pop) the keys keep their usual cursor moves. The stack lives in this tab's
// sessionStorage (it survives switching conversations and reloads, including
// dev live-reload), falling back to memory when storage is unavailable; it is
// never sent anywhere.
function meDraftKey(form){ return 'me-drafts:'+(form.dataset.to||''); }
function meDrafts(form){
  try{ return JSON.parse(sessionStorage.getItem(meDraftKey(form))||'[]'); }
  catch(_){ return form._drafts||[]; }
}
function meSaveDrafts(form, d){
  form._drafts=d;
  try{ sessionStorage.setItem(meDraftKey(form), JSON.stringify(d)); }catch(_){}
  meDraftChip(form);
}
function meDraftChip(form){
  if(!form) return;
  var chip=form.parentNode.querySelector('.draft-chip');
  if(!chip){
    chip=document.createElement('button');
    chip.type='button'; chip.className='draft-chip';
    chip.title='Restore the top stacked draft (⌘↑) — the box must be empty';
    chip.onclick=function(){ mePopDraft(form); };
    form.parentNode.insertBefore(chip, form);
  }
  var n=meDrafts(form).length;
  chip.hidden = n===0;
  chip.textContent='↩ '+n+' stacked draft'+(n===1?'':'s');
}
function mePushDraft(form){
  var t=form.body, text=t.value;
  if(!text.trim()) return false;
  var d=meDrafts(form);
  d.push({text:text, sel:t.selectionStart});
  meSaveDrafts(form, d);
  t.value=''; t._enterArmed=false; t.focus();
  return true;
}
function mePopDraft(form){
  var t=form.body;
  if(t.value.trim()) return false;
  var d=meDrafts(form), top=d.pop();
  if(!top) return false;
  meSaveDrafts(form, d);
  t.value=top.text; t.focus();
  var s=Math.min(top.sel, top.text.length); t.setSelectionRange(s, s);
  return true;
}
document.addEventListener('keydown', function(e){
  var t=e.target;
  if(!t.matches || !t.matches('.composer textarea')) return;
  var mac=/Mac|iPhone|iPad/.test(navigator.platform);
  if(!(mac ? e.metaKey : e.ctrlKey) || e.shiftKey || e.altKey) return;
  if(e.key==='ArrowDown' && mePushDraft(t.form)){ e.preventDefault(); }
  else if(e.key==='ArrowUp' && mePopDraft(t.form)){ e.preventDefault(); }
});
document.querySelectorAll('.composer form').forEach(meDraftChip);
</script>
</body>
</html>{{end}}
