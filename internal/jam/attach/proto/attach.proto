syntax = "proto3";
// The proto package stays harbor.attach.v1 through the Harbor → Jam rename: it
// is the gRPC wire name (/harbor.attach.v1.Runtime/Attach) that cove-master in
// already-built cove images dials, so renaming it would break running coves.
// See docs/usage/jam/renamed-from-harbor.md.
package harbor.attach.v1;
option go_package = "github.com/aethons-tools/cove/internal/jam/attach/attachpb";

service Runtime {
  rpc Attach(stream StatusUp) returns (stream ControlDown);
}

message StatusUp {
  oneof msg {
    Activity     status    = 1;
    Heartbeat    heartbeat = 2;
    SessionEvent event     = 3;
    ConnectorApplied connector = 4;
  }
}

// ConnectorApplied reports the fingerprint (snippet.Fingerprint) of the
// connector cove-master applied to the agent's most recent spawn. Jam compares it
// with the role's current connector to flag a stale studio.
message ConnectorApplied { string fingerprint = 1; }

// SessionEvent is one line of the agent's claude stream-json stdout.
message SessionEvent {
  string stream_id        = 1; // random per cove-master process: 32 lowercase hex chars
  uint64 seq              = 2; // monotonic per stream_id, from 1
  uint32 turn             = 3; // claude invocation number, from 1
  int64  observed_unix_ms = 4; // when cove-master read the line
  bytes  raw              = 5; // the line, no trailing newline, secrets redacted
  uint64 truncated_bytes  = 6; // bytes dropped from raw; 0 = intact
}
enum Activity {
  ACTIVITY_UNSPECIFIED = 0;
  RUNNING = 1;
  WAITING = 2;
  BLOCKED = 3;
  DONE    = 4;
}
message Heartbeat {}

message ControlDown {
  oneof msg {
    Wake        wake     = 1;
    Teardown    teardown = 2;
    TierChanged tier     = 3;
    RotateToken rotate   = 4; // reserved
    EventAck    ack      = 5;
  }
}

// EventAck is cumulative: every event of stream_id with seq <= this is durable.
message EventAck {
  string stream_id = 1;
  uint64 seq       = 2;
}
message Wake {}
message Teardown    { string reason = 1; }
message TierChanged { int32 tier = 1; }
message RotateToken { string token = 1; }
