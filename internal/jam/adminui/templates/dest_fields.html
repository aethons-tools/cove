{{/* dest-fields is the destination form body shared by create (no .Dest.Name
     yet: asks for one) and edit (name is the key, not editable). Takes a
     destDetail: .Dest current values, .Form.Env, .Form.AllowPaths, .Methods. */}}
{{define "dest-fields"}}
<div class="grid">
  {{if not .Dest.Name}}<label>Name <span class="req">required</span><input name="name" required autocomplete="off"></label>{{end}}
  <label>Route <span class="req">required</span><input name="route" value="{{.Dest.Route}}" required placeholder="/anthropic/"></label>
  <label class="wide">Upstream URL <span class="req">required</span><input name="upstream" value="{{.Dest.Upstream}}" required placeholder="https://api.example.com"></label>
  <label>Identity in <span class="hint">how an agent presents its identity token</span>
    <select name="identity-in">{{$v := .Dest.IdentityIn}}{{range .Methods}}<option value="{{.}}"{{if eq . $v}} selected{{end}}>{{.}}</option>{{end}}{{if eq $v "custom"}}<option value="custom" selected>custom (spec shown in Broker section; edit via import/API)</option>{{end}}</select></label>
  <label>Apply as <span class="hint">how the credential is sent upstream</span>
    <select name="apply">{{$v := .Dest.Apply}}{{range .Methods}}<option value="{{.}}"{{if eq . $v}} selected{{end}}>{{.}}</option>{{end}}{{if eq $v "custom"}}<option value="custom" selected>custom (spec shown in Broker section; edit via import/API)</option>{{end}}</select></label>
  <label>Default credential <span class="hint">cred-name; a role can map its own</span><input name="cred-name" data-ta="credentials" value="{{.Dest.CredName}}" autocomplete="off" spellcheck="false"></label>
  <label class="wide">Client env <span class="hint">one <code>KEY=TEMPLATE</code> per line; placeholders <code>{url}</code> <code>{base}</code> <code>{host}</code> <code>{token}</code>. Leave empty for the route's legacy default (<code>/anthropic/</code>, <code>/git/</code>).{{if and (eq .Dest.Route "/git/") (not .Dest.Env)}} Adding env here drops <code>/git/</code>'s implied git routing — tick “Route git” to keep it.{{end}}</span>
    <textarea name="env" spellcheck="false" placeholder="GH_HOST={host}">{{.Form.Env}}</textarea></label>
  <label class="wide">Allowed paths <span class="hint">one <code>path.Match</code> pattern per line, matched against the path after the route (<code>*</code> never crosses <code>/</code>); anything else is refused 403. Leave empty to allow any path.</span>
    <textarea name="allow-paths" spellcheck="false" placeholder="/v1/projects/my-project/locations/us-east5/publishers/anthropic/models/*:streamRawPredict">{{.Form.AllowPaths}}</textarea></label>
  <label class="wide">Note <span class="hint">shown to agents granted this destination — how to use it (≤ 300 bytes)</span><input name="note" value="{{.Dest.Note}}" maxlength="300" spellcheck="false"></label>
  <label class="check"><input type="checkbox" name="git"{{if .Dest.Git}} checked{{end}}> Route git <span class="hint">agents send <code>https://github.com/</code> through this route</span></label>
</div>
<style>label.check{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}label.check input{width:auto}</style>
{{end}}
