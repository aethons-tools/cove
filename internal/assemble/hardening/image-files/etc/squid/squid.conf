http_port 3128

# Domain allow-list (matched against the CONNECT/Host target hostname).
# No TLS interception is needed: squid filters on the hostname, not the payload.
# Sealed base: always on, identical for every sandbox.
acl allowed_domains dstdomain "/etc/squid/allowed_domains.txt"
# Kit infrastructure (model provider, self-hosted GitLab, harbor hosts), baked
# from the kit at build: always on — a harbor role's egress policy cannot remove it.
acl allowed_infra_domains dstdomain "/etc/squid/allowed_domains.infra.txt"
# Active egress policy list: baked from the kit's image.allowed-domains (the
# default), and replaced (root-only, via apply-role-egress.sh) by a harbor role's
# list at raise. A role's list must fit inside the kit's baked ceiling, which that
# helper enforces; the ceiling file is deliberately not an ACL here.
acl allowed_kit_domains dstdomain "/etc/squid/allowed_domains.kit.txt"
# Per-session allow-list: rewritten (root-only) at session start with the
# handler class's <common> ∪ class delta and applied via `squid -k reconfigure`
# (COV-39). Baked empty (header only) so the ACL never dangles; a no-class
# session leaves it empty. Additive — it can only widen, never bypass the base.
acl allowed_session_domains dstdomain "/etc/squid/allowed_domains.session.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# Only permit HTTPS CONNECT tunnels, and only to allow-listed domains.
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access allow allowed_infra_domains
http_access allow allowed_kit_domains
http_access allow allowed_session_domains
http_access deny all

# This box is an egress gate, not a cache.
cache deny all
access_log stdio:/var/log/squid/access.log
# Watch this log to discover any domain Claude Code needs that you forgot to allow.
