#!/usr/sbin/nft -f
flush ruleset

# Egress containment.
# - The 'agent' user gets NO direct network: only loopback (to reach squid).
# - Only the 'proxy' user (squid) may open outbound connections, and only on
#   53 (DNS) and 80/443. Squid then enforces the domain allow-list on top.
# - INPUT is deliberately left unfiltered so Fly's platform plumbing
#   (Hallpass on :22, private-network DNS, health checks) keeps working.

table inet egress {
    chain output {
        type filter hook output priority 0; policy drop;

        oifname "lo" accept
        ct state established,related accept

        meta skuid "proxy" udp dport 53 accept
        meta skuid "proxy" tcp dport 53 accept
        meta skuid "proxy" tcp dport { 80, 443 } accept

        # everything else (all direct egress from the agent) is dropped
    }

    # Nested-container containment (always-on; COV-121).
    # When a kit runs Docker (opt-in, via Sysbox), a nested container's traffic is
    # masqueraded and *forwarded* out the uplink — it is NOT locally generated, so
    # it never traverses the 'output' chain's skuid rule and would otherwise bypass
    # the egress lock entirely. Default-drop the forward path and allow only
    # established/related return traffic, so nested-container egress is contained by
    # the same lock: reaching the outside requires going through squid.
    # Zero-impact on non-docker sandboxes (they generate no forwarded traffic), and
    # harmless to same-network container-to-container, which is L2-bridged and does
    # not traverse the forward hook.
    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
    }
}
