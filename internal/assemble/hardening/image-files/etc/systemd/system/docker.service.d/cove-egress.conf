# Sealed drop-in (COV-118, COV-125): the inner rootful dockerd must not start until
# the egress lock is fully up, so its very first registry pull — and any container it
# later runs — is already behind the nftables drop-all (cove-egress) AND squid
# (cove-squid). Requires (not just After) BOTH so a failed lock keeps docker down
# rather than running it unlocked.
[Unit]
After=cove-egress.service cove-squid.service
Requires=cove-egress.service cove-squid.service
