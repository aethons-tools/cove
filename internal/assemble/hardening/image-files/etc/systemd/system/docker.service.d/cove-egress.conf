# Sealed drop-in (COV-118): the inner rootful dockerd must not start until the
# egress lock is up, so its very first registry pull — and any container it later
# runs — is already behind the nftables drop-all + squid. Requires (not just
# After) so a failed lock keeps docker down rather than running it unlocked.
[Unit]
After=cove-egress.service
Requires=cove-egress.service
