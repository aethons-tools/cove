# Sealed drop-in: the systemd base image ships the distro `squid.service` (enabled by
# preset), which supervises squid as the egress proxy — the only permitted egress —
# and maintains /run/squid.pid, so per-session `squid -k reconfigure`
# (apply-session-domains, COV-39) works. We reuse it rather than running a second
# squid: a second unit collided ("Squid is already running") and corrupted the pid
# file — the COV-125 regression this replaces. Order the distro squid AFTER the
# nftables drop (cove-egress) and require it, so squid never comes up before the lock;
# the sshd/docker drop-ins in turn require squid.service, so they start after squid.
[Unit]
After=cove-egress.service
Requires=cove-egress.service
