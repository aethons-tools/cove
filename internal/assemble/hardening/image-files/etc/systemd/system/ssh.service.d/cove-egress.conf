# Sealed drop-in (COV-118): order sshd after the egress lock (defence-in-depth —
# ssh itself is inbound, which INPUT leaves unfiltered, but nothing network-facing
# should precede the lock), and generate host keys first (a freshly built image
# may not have them — the script entrypoint runs `ssh-keygen -A` for the non-docker
# path; the systemd path needs the equivalent as an ExecStartPre).
#
# Verified on colima+Sysbox (COV-118): Ubuntu 24.04 runs ssh via socket activation
# (ssh.socket, Accept=no), which triggers *ssh.service* on connection — so this
# drop-in targets the right unit: ssh.service starts After+Requires the egress units
# and runs the keygen. cove-egress.service lists ssh.socket in Before=, so the listener
# itself opens after the lock is up; squid is the base image's distro squid.service.
[Unit]
After=cove-egress.service squid.service
Requires=cove-egress.service squid.service

[Service]
ExecStartPre=/usr/bin/ssh-keygen -A
