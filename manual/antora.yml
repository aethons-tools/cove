# The Jam manual: what the product does, for the people using it.
# No `version` here: the playbook maps the branch to a version (release is
# Released, main is Next, goal is Goal), so these files are identical on every
# branch. See docs/modules/ROOT/pages/manual.adoc.
name: jam
title: Jam manual
nav:
- modules/ROOT/nav.adoc
- modules/projects/nav.adoc
- modules/conventions/nav.adoc
ext:
  internal:
    # Whole modules that are internal: the customer build drops them, the team
    # build badges them (manual/extensions/internal.js). See docs/modules/ROOT/pages/manual.adoc.
    modules: []
