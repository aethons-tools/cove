<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: a unit of work's page (COV-408)</title>
<style>
  :root { --acc:#b0285f; --acc-bg:#f1d7e1; --muted:#868e96; --line:#e9ecef; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; color:#212529; }
  .bar { padding:6px 12px; background:#f8f9fa; border-bottom:1px solid var(--line); font-size:13px; display:flex; gap:14px; align-items:center; }
  .bar b { color:var(--acc); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:3px 10px; font-size:12px; cursor:pointer; color:var(--muted); }
  .seg button.on { background:var(--acc-bg); color:#7a1d43; }
  .app { flex:1; display:flex; min-height:0; }
  .rail { width:300px; border-right:1px solid var(--line); padding:14px 10px; overflow:auto; flex:none; }
  .narrow .rail { display:none; }
  h3 { font-size:12px; letter-spacing:.06em; color:var(--muted); margin:18px 6px 6px; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:14px; }
  .row:hover { background:#f8f9fa; }
  .row.sel { background:var(--acc-bg); color:#7a1d43; }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { font-size:11px; border:1px solid; border-radius:10px; padding:0 6px; white-space:nowrap; }
  .working { color:#2f9e44; } .idle, .ended { color:var(--muted); } .waiting { color:#e67700; }
  .count { background:var(--acc); color:#fff; border-radius:10px; font-size:11px; min-width:18px; text-align:center; padding:1px 5px; }
  .page { flex:1; display:flex; flex-direction:column; min-width:0; }
  .narrow .page { max-width:400px; border-right:1px solid var(--line); }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header .key { font-weight:700; }
  header a { color:inherit; text-decoration:none; }
  header a:hover { text-decoration:underline; }
  header .title { font-size:17px; flex:1; min-width:0; }
  .state { font-size:12px; font-weight:600; border-radius:10px; padding:2px 8px; }
  .s-in-review { background:#e7f5ff; color:#1971c2; }
  .s-in-progress { background:#ebfbee; color:#2f9e44; }
  .s-needs-input { background:#fff4e6; color:#e67700; }
  .tracker { font-size:12px; color:var(--muted); }
  .tabs { display:none; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; background:#fff; padding:8px; font-size:13px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs button.on { color:#7a1d43; border-bottom-color:var(--acc); }
  .narrow .tabs { display:flex; }
  .body { flex:1; display:flex; min-height:0; }
  .stacked .body { flex-direction:column; }
  .log { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .entries { flex:1; overflow:auto; padding:12px 18px; }
  .entry { margin:0 0 12px; font-size:14px; }
  .entry .who { font-weight:600; } .entry .when { color:var(--muted); font-size:12px; margin-left:6px; }
  .entry .what { margin-top:2px; }
  .entry.event .what { color:var(--muted); font-size:13px; }
  .composer { border-top:1px solid var(--line); padding:10px 18px; display:flex; gap:8px; }
  .composer input { flex:1; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .composer button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:0 14px; }
  aside { width:300px; border-left:1px solid var(--line); overflow:auto; padding:6px 14px; flex:none; }
  aside.closed { width:34px; padding:6px 4px; }
  aside.closed section, aside.closed .hidehint { display:none; }
  .collapse { border:0; background:none; cursor:pointer; color:var(--muted); font-size:13px; padding:4px 0; }
  .stacked aside { width:auto; border-left:0; border-bottom:1px solid var(--line); order:-1; display:flex; gap:28px; padding:4px 18px 10px; }
  .stacked .collapse { display:none; }
  .narrow aside { width:auto; border:0; }
  .narrow .collapse { display:none; }
  .narrow.tab-log aside, .narrow.tab-rec .log { display:none; }
  aside h4 { font-size:11px; letter-spacing:.06em; color:var(--muted); margin:12px 0 6px; }
  .item { display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 0; }
  .item .n { flex:1; min-width:0; }
  .item .d { display:block; color:var(--muted); font-size:12px; }
  .item a { color:#1971c2; text-decoration:none; }
  .item a:hover { text-decoration:underline; }
  .item .nolink { color:var(--muted); }
  .pr-open { color:#2f9e44; } .pr-merged { color:#7048e8; } .pr-closed { color:#c92a2a; }
  .note { font-size:12px; color:var(--muted); margin:14px 0 4px; }
</style>
</head>
<body>
<div class="bar">
  <span><b>Mockup</b> COV-408: a unit of work's page</span>
  <span>Layout <span class="seg" id="layout"><button class="on" data-v="side">Side panel</button><button data-v="stacked">Stacked</button><button data-v="narrow">Narrow screen</button></span></span>
  <span style="color:var(--muted)">Click the rail's Work rows to switch units. Links are fake.</span>
</div>
<div class="app" id="app">
  <nav class="rail" aria-label="Conversations">
    <h3>WORK</h3>
    <div id="work"></div>
  </nav>
  <div class="page">
    <header>
      <a class="key" id="key" href="#" title="Open the issue on the tracker"></a>
      <a class="title" id="title" href="#" title="Open the issue on the tracker"></a>
      <span class="state" id="state"></span>
      <span class="tracker">Linear ↗</span>
    </header>
    <div class="tabs" id="tabs"><button class="on" data-t="log">Log</button><button data-t="rec">Agents &amp; pull requests</button></div>
    <div class="body">
      <div class="log">
        <div class="entries" id="entries"></div>
        <div class="composer"><input id="msg" placeholder="Write to the work log…"><button id="send">Send</button></div>
      </div>
      <aside id="aside">
        <button class="collapse" id="collapse" title="Hide the panel">⟩ <span class="hidehint">Hide</span></button>
        <section><h4>AGENTS</h4><div id="agents"></div></section>
        <section><h4>PULL REQUESTS</h4><div id="prs"></div></section>
      </aside>
    </div>
  </div>
</div>
<script>
const units = {
  "COV-408": {
    title:"Unit of work: its page in the Inbox", state:"in-review", unread:2,
    workers:[
      {label:"cov-408", status:"working", current:true, started:"Nov 17, 14:02", view:true},
    ],
    prs:[{n:748, title:"Give a unit of work its own page in the Inbox", state:"open"}],
    log:[
      {who:"Jam", when:"14:02", ev:true, what:"cov-408 started working on this unit."},
      {who:"cov-408", when:"14:05", what:"Starting with the route and the rail link. Tests first."},
      {who:"cov-408", when:"15:40", what:"Opened #748. Moving to in review."},
      {who:"Jam", when:"15:41", ev:true, what:"State: in review. Pull request #748 reported."},
      {who:"review-bot", when:"16:10", ev:true, what:"#748 reviewed by review-bot: changes requested. View the review ↗"},
      {who:"cov-408", when:"16:32", what:"Fixed both comments and pushed. Asked for another review."},
    ]},
  "COV-407": {
    title:"Post pull request reviews, merges and closes to the work log", state:"in-progress", unread:0,
    workers:[
      {label:"cov-407-b", status:"waiting", current:true, started:"Nov 16, 09:12", view:true},
      {label:"cov-407", status:"ended", current:false, started:"Nov 15, 10:00", stopped:"Nov 15, 18:30", view:false},
    ],
    prs:[
      {n:741, title:"Post PR reviews to the work log", state:"closed"},
      {n:745, title:"Post pull request reviews, merges and closes to the work log", state:"merged"},
    ],
    log:[
      {who:"Jam", when:"Nov 15", ev:true, what:"cov-407 started working on this unit."},
      {who:"Jam", when:"Nov 15", ev:true, what:"#741 closed without merging."},
      {who:"Jam", when:"Nov 16", ev:true, what:"cov-407 ended. cov-407-b started working on this unit."},
      {who:"cov-407-b", when:"Nov 16", what:"Picking up from #741 with a smaller change."},
      {who:"Jam", when:"Nov 17", ev:true, what:"#745 merged by alex."},
    ]},
};
let cur = "COV-408", layout = "side", tab = "log";
const $ = id => document.getElementById(id);
const stateText = s => s.replace("-", " ");
function render(){
  const u = units[cur];
  $("app").className = "app " + (layout==="side" ? "" : layout) + (layout==="narrow" ? " tab-"+tab : "");
  $("key").textContent = cur; $("title").textContent = u.title;
  $("state").className = "state s-"+u.state; $("state").textContent = stateText(u.state);
  $("work").innerHTML = Object.entries(units).map(([k,w]) => {
    const c = w.workers.find(x=>x.current);
    return `<div class="row ${k===cur?"sel":""}" data-k="${k}"><span class="name"><b>${k}</b> ${w.title}<br><span class="pill ${c.status}">${c.label} · ${c.status}</span></span>${w.unread&&k!==cur?`<span class="count">${w.unread}</span>`:""}</div>`;
  }).join("");
  document.querySelectorAll("#work .row").forEach(r => r.onclick = () => { cur = r.dataset.k; units[cur].unread = 0; render(); });
  $("entries").innerHTML = u.log.map(e => `<div class="entry ${e.ev?"event":""}"><span class="who">${e.who}</span><span class="when">${e.when}</span><div class="what">${e.what}</div></div>`).join("");
  $("entries").scrollTop = 1e6;
  $("agents").innerHTML = u.workers.map(w => `<div class="item"><span class="n">${w.view?`<a href="#" title="Open its session view">${w.label}</a>`:`<span class="nolink" title="Not yours to open">${w.label}</span>`}<span class="d">${w.current?"Worker now, since "+w.started:w.started+" to "+w.stopped}</span></span><span class="pill ${w.status}">${w.status}</span></div>`).join("");
  $("prs").innerHTML = u.prs.map(p => `<div class="item"><span class="n"><a href="#">#${p.n}</a> ${p.title}</span><span class="pill pr-${p.state}">${p.state}</span></div>`).join("")
    + `<p class="note">Reviews, merges, and closes also post to the log.</p>`;
}
document.querySelectorAll("#layout button").forEach(b => b.onclick = () => {
  layout = b.dataset.v; document.querySelectorAll("#layout button").forEach(x => x.classList.toggle("on", x===b)); render(); });
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x===b)); render(); });
$("collapse").onclick = () => { const a = $("aside"); a.classList.toggle("closed"); $("collapse").firstChild.textContent = a.classList.contains("closed") ? "⟨ " : "⟩ "; };
$("send").onclick = () => { const v = $("msg").value.trim(); if (!v) return;
  units[cur].log.push({who:"you", when:"now", what:v}); $("msg").value = ""; render(); };
$("msg").onkeydown = e => { if (e.key==="Enter") $("send").onclick(); };
if (location.hash==="#shot") document.querySelector(".bar").style.display="none";
render();
</script>
</body>
</html>
