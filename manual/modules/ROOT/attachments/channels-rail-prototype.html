<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox rail prototype: Me, Work, Agents</title>
<style>
  :root { --acc:#b0285f; --acc-bg:#f1d7e1; --muted:#868e96; --line:#e9ecef; }
  body { margin:0; font-family: system-ui, sans-serif; display:flex; height:100vh; color:#212529; }
  .rail { width:340px; border-right:1px solid var(--line); padding:14px 10px; overflow:auto; box-sizing:border-box; }
  .main { flex:1; padding:24px; color:var(--muted); }
  .new { background:var(--acc-bg); color:#7a1d43; border:0; border-radius:8px; padding:8px 14px; font-weight:600; font-size:14px; }
  h3 { font-size:12px; letter-spacing:.06em; color:var(--muted); margin:18px 6px 6px; display:flex; align-items:center; justify-content:space-between; }
  .toggle { font-size:11px; letter-spacing:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:inline-flex; }
  .toggle button { border:0; background:#fff; padding:2px 8px; font-size:11px; cursor:pointer; color:var(--muted); }
  .toggle button.on { background:var(--acc-bg); color:#7a1d43; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:14px; user-select:none; }
  .row:hover { background:#f8f9fa; }
  .row.sel { background:var(--acc-bg); color:#7a1d43; }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { color:var(--muted); font-size:12px; }
  .grip { color:#ced4da; cursor:grab; font-size:12px; }
  .pill { font-size:11px; border:1px solid; border-radius:10px; padding:0 6px; }
  .working { color:#2f9e44; } .idle { color:var(--muted); } .waiting { color:#e67700; }
  .count { background:var(--acc); color:#fff; border-radius:10px; font-size:11px; min-width:18px; text-align:center; padding:1px 5px; }
  .needs { color:#e67700; font-size:12px; font-weight:600; }
  .kind { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 3px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin:6px 2px; cursor:pointer; background:#fff; }
  .card:hover { border-color:#ced4da; }
  .card .top { display:flex; align-items:center; gap:8px; }
  .card .avatar { width:32px; height:32px; background:#e9ecef; border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .card b { flex:1; }
  .card .mission { font-size:13px; margin-top:6px; }
  .card .focus { font-size:12px; color:#2f9e44; }
  .dragging { opacity:.4; }
  .over { box-shadow: 0 -2px 0 var(--acc) inset; }
  .note { font-size:12px; color:var(--muted); margin:4px 8px; }
</style>
</head>
<body>
<nav class="rail" aria-label="Conversations">
  <button class="new">New message</button>

  <h3>ME <span class="toggle" role="group" aria-label="Show"><button class="on" data-f="all">All</button><button data-f="unread">Unread</button></span></h3>
  <div id="me" class="list"></div>

  <h3>WORK</h3>
  <div id="work"></div>

  <h3>AGENTS</h3>
  <div id="agents" class="list"></div>
  <p class="note">Drag rows and cards to reorder. New agents join at the bottom.</p>
</nav>
<main class="main" id="main">Click a row or card.</main>
<script>
const me = [
  {id:"dm-editor", name:"editor", kind:"DM", status:"working", unread:0},
  {id:"ops", name:"ops", kind:"room", unread:2},
  {id:"dm-bob", name:"bob", kind:"DM", unread:0},
  {id:"acme42", name:"ACME-42", kind:"work", unread:1, needs:true},
  {id:"dm-review", name:"review-bot", kind:"DM", status:"idle", unread:0},
];
const work = [
  {key:"ACME-42", title:"Fix the flaky login test", worker:"acme-42", status:"waiting", unread:1},
  {key:"ACME-51", title:"Add the release checklist", worker:"acme-51", status:"working", unread:0},
];
const agents = [
  {name:"editor", status:"working", mission:"Keep the books in sync", focus:"Drafting the Inbox rail"},
  {name:"acme-42", status:"waiting", mission:"Fix the flaky login test", focus:"Needs you: which test runner?"},
  {name:"review-bot", status:"idle", mission:"Review cove pull requests", focus:""},
  {name:"acme-51", status:"working", mission:"Add the release checklist", focus:"Writing the steps"},
];
let filter = "all";
const main = document.getElementById("main");
function open(what){ main.textContent = what; document.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel")); }
function draggable(el, arr, i, render){
  el.draggable = true;
  el.addEventListener("dragstart", e => { el.classList.add("dragging"); e.dataTransfer.setData("text/plain", i); });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over");
    const from = +e.dataTransfer.getData("text/plain"); const [x] = arr.splice(from,1); arr.splice(i,0,x); render(); });
}
function renderMe(){
  const box = document.getElementById("me"); box.innerHTML = "";
  me.forEach((c,i) => {
    if (filter==="unread" && !c.unread && !c.needs) return;
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span class="grip">⋮⋮</span><span class="name">${c.name}</span>` +
      (c.needs ? `<span class="needs" title="Needs you">●</span>` : "") +
      (c.status ? `<span class="pill ${c.status}">${c.status}</span>` : `<span class="kind">${c.kind}</span>`) +
      (c.unread ? `<span class="count">${c.unread}</span>` : "");
    r.onclick = () => { open(`Conversation: ${c.name} (${c.kind})`); r.classList.add("sel"); };
    draggable(r, me, i, renderMe); box.appendChild(r);
  });
}
function renderWork(){
  const box = document.getElementById("work"); box.innerHTML = "";
  work.forEach(w => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span class="name"><b>${w.key}</b> ${w.title}<br><a class="pill ${w.status}" title="Open ${w.worker}'s session view">${w.worker} · ${w.status}</a></span>` +
      (w.unread ? `<span class="count">${w.unread}</span>` : "");
    r.onclick = () => { open(`Work log: ${w.key}`); r.classList.add("sel"); };
    r.querySelector("a").onclick = e => { e.stopPropagation(); open(`Session view: ${w.worker}`); };
    box.appendChild(r);
  });
}
function renderAgents(){
  const box = document.getElementById("agents"); box.innerHTML = "";
  agents.forEach((a,i) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="top"><span class="avatar">🤖</span><b>${a.name}</b><span class="pill ${a.status}">${a.status}</span></div>` +
      `<div class="mission">${a.mission}</div>` + (a.focus ? `<div class="focus">${a.focus}</div>` : "");
    c.onclick = () => open(`Session view: ${a.name}`);
    draggable(c, agents, i, renderAgents); box.appendChild(c);
  });
}
document.querySelectorAll(".toggle button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".toggle button").forEach(x => x.classList.toggle("on", x===b)); renderMe(); });
renderMe(); renderWork(); renderAgents();
</script>
</body>
</html>
