# Builds the three versions of the manual side by side (`just manual-site`):
# release is Released, main is Next, goal is Goal. Antora takes your local
# branch of that name, else origin's; the branch you have checked out is read
# from the working tree. See docs/manual.md.
site:
  title: Jam manual
  start_page: released@jam:ROOT:index.adoc
content:
  sources:
  - url: ..
    start_path: manual
    branches: [release, main, goal]
    version:
      release: released
      main: next
      goal: goal
asciidoc:
  attributes:
    # The team manual: show `ifdef::internal[]` notes. Unset it for a user build.
    internal: ''
ui:
  bundle:
    url: ./ui
    snapshot: true
output:
  dir: ./build/site
runtime:
  fetch: false
