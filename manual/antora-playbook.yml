# Builds the three versions of the manual side by side (`just manual-site`):
# release is Released, main is Next, goal is Goal. Antora takes your local
# branch of that name, else origin's; the branch you have checked out is read
# from the working tree. See docs/manual.md.
site:
  title: Jam manual
  start_page: released@jam:ROOT:index.adoc
content:
  sources:
  - url: ..
    start_path: manual
    branches: [release, main, goal]
    version:
      release: released
      main: next
      goal: goal
antora:
  extensions:
  # Drops internal pages, modules, phrases and their files when `internal` is
  # unset; badges internal pages in the nav when it is set. Whole internal
  # modules are listed in antora.yml. See docs/manual.md ("Marking content internal").
  - require: ./extensions/internal.js
asciidoc:
  attributes:
    # The team manual: keep (and mark) internal content. The customer build omits it.
    internal: ''
  extensions:
  # Drops `[.internal]` blocks and sections when `internal` is unset.
  - ./extensions/internal-blocks.js
ui:
  bundle:
    url: ./ui
    snapshot: true
output:
  dir: ./build/site
runtime:
  fetch: false
