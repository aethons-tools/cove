name: cove

tracker:
  linear:
    team: COV
    secrets:
      AT_DISPATCH_TRACKER_TOKEN: {}
      AT_DISPATCH_WEBHOOK_SECRET: {}
    poll-interval: 60s
    states:
      ready: Todo
      in-progress: In Progress
      in-review: In Review
      done: Done
      needs-input: Needs Input
      blocked: Backlog

source-control:
  github:
    main-branch: main
    project: aethons-tools/cove
    secrets:
      AT_TASK_GIT_TOKEN: {}

dispatch:
  concurrency: 1
  reaper-timeout: 45m

workers:
  <common>:
    secrets:
      ANTHROPIC_AUTH_TOKEN: {}
  implementor:
    prompt: "Whenever poetry is involved, use a Shakespearean style."
    timeout: 90m
    concurrency: 3

collaborators:
  <common>:
    secrets:
      GITHUB_TOKEN: {}
  planner:
    prompt: |
      Work with the user to intake and plan work from the Linear board.
      The workspace is shared with the user.
    share-repo-dir: true
  reviewer:
    prompt: |
      Watch the Linear board COV team for "In Review" tickets labeled "class:implementor".
      For each, review the associated PR (pull the branch local) and if acceptable,
      merge-squash the PR and move the ticket to "Done".
      If the PR is not acceptable, document the reason in the ticket and move the ticket to "Needs Input".
  floater:
    prompt: |
      Work with the user to manage emergent tasks, which may include planning in parallel with the
      primary planner's efforts.

image:
  # This repo builds out its toolchain image in CI rather than locally.
  base: ghcr.io/aethons-tools/cove-image@sha256:9292e42429bd7a93f67e35a100c7a1b533e0a0911c3a9f326eb2374ca738ae2f
  allowed-domains:
    # Go dependencies
    - gopkg.in
    # Go toolchain download (GOTOOLCHAIN auto-fetch; agent Go (re)install)
    - go.dev
    - dl.google.com
    # GHCR registry API: resolve cove-image / cove-base-image tag->digest for
    # base adoption (see cmd/adopt-base) and ad-hoc manifest inspection. Manifest
    # lookups only; a full image pull would also need the blob CDN host + Docker.
    - ghcr.io