name: cove

tracker:
  linear:
    team: COV
    secrets:
      AT_DISPATCH_TRACKER_TOKEN: {}
      AT_DISPATCH_WEBHOOK_SECRET: {}
    poll-interval: 60s
    states:
      ready: Todo
      in-progress: In Progress
      in-review: In Review
      done: Done
      needs-input: Needs Input
      blocked: Backlog

source-control:
  github:
    main-branch: main
    project: aethons-tools/cove
    secrets:
      AT_TASK_GIT_TOKEN: {}

dispatch:
  concurrency: 1
  reaper-timeout: 45m

workers:
  <common>:
    secrets:
      ANTHROPIC_AUTH_TOKEN: {}
  implementor:
    prompt: "Whenever poetry is involved, use a Shakespearean style."
    timeout: 90m
    concurrency: 3

collaborators:
  <common>:
    secrets:
      GITHUB_TOKEN: {}
  planner:
    prompt: Work with the user to intake and plan work from the Linear board.

image:
  # This repo builds out its toolchain image in CI rather than locally.
  base: ghcr.io/aethons-tools/cove-image:2026.07.17-35b3bf2
  allowed-domains:
    # Go dependencies
    - gopkg.in