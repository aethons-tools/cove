name: cove

tracker:
  linear:
    team: COV
    secrets:
      AT_DISPATCH_TRACKER_TOKEN:
        command: [ bash, -c, ". ~/.config/at-cove/secrets.yml && echo $AT_DISPATCH_TRACKER_TOKEN" ]
      AT_DISPATCH_WEBHOOK_SECRET:
        command: [bash, -c, "echo none"]
    poll-interval: 60s
    states:
      ready: Todo
      in-progress: In Progress
      in-review: In Review
      done: Done
      needs-input: Needs Input
      blocked: Backlog

source-control:
  github:
    main-branch: main
    project: aethons-tools/cove
    secrets:
      AT_TASK_GIT_TOKEN:
        command: [ bash, -c, ". ~/.config/at-cove/secrets.yml && echo $GITHUB_TOKEN" ]

dispatch:
  concurrency: 1
  reaper-timeout: 45m

workers:
  implementor:
    prompt: "You are an implementer. ..."
    timeout: 90m
    concurrency: 3

collaborators:
  planner:
    secrets:
      LINEAR_TOKEN:
        command: [ "true" ]

image:
  setup-scripts:
    - .install-files/install.sh
    # TODO - rm -rf /.install-files
  paths:
    - /usr/local/go/bin
    - /home/agent/go/bin
  env:
    GOROOT: /usr/local/go
    GOPATH: /home/agent/go
    GOPROXY: direct
    GOSUMDB: off
    GOFLAGS: -mod=mod
  allowed-domains:
    # Go dependencies
    - gopkg.in