# Reference worker kit for `at-cove dispatch`. This is a TEMPLATE: complete the
# base image, the claude install, the pinned at-task ref, the target project's
# toolchain, and the full allowed-domains for your project. See RUNBOOK.md.
name: reference-worker

source-control:
  github:
    project: your-org/your-repo   # ← set to the target repo
    main-branch: main
    secrets:
      # Code-host token used ONLY by at-task prepare/complete (clone/push/PR).
      # Resolved on the host, minted per git step, injected in memory. The agent never sees it.
      AT_TASK_GIT_TOKEN:
        description: per-task GitHub App installation token — push + PR on the repo, minted per run

tracker:
  linear:
    team: your-team-key        # ← set to your Linear team
    poll-interval: 60s
    states:
      ready: Todo
      in-progress: In Progress
      in-review: In Review
      done: Done
      needs-input: Needs Input
      blocked: Backlog
    secrets:
      AT_DISPATCH_TRACKER_TOKEN:  { description: "Linear API token for the scheduler" }
      AT_DISPATCH_WEBHOOK_SECRET: { description: "Linear webhook signing secret" }

dispatch:
  concurrency: 1
  reaper-timeout: 45m

collaborators:
  triager:
    secrets:
      LINEAR_TOKEN: { description: "Linear API token for the triager collaborator" }

image:
  setup-scripts:
    - .install-files/install.sh
  allowed-domains:
    - api.anthropic.com   # the agent (claude)
    - api.github.com      # at-task PR API
    - github.com          # at-task clone/push
    # + your target project's dependency registries (e.g. proxy.golang.org, registry.npmjs.org)

# at-cove wraps each class below in the prepare -> agent -> complete bracket itself:
# at-task prepare, then `claude -p "<prompt>"`, then at-task complete.
#
# Worker secrets are injected ONLY into the agent step of a dispatched run
# (never into `chat`, never into the git steps). This kit only DEMANDS them
# (name + description) — every value is supplied machine-side, out of source
# control, in ~/.config/at-cove/secrets.yml (see RUNBOOK.md). A dispatched
# worker authenticates to Anthropic with a short-lived bearer,
# ANTHROPIC_AUTH_TOKEN, NOT the interactive subscription OAuth login (at-cove
# does not seed OAuth credentials on the work path, so a keyless worker fails
# closed rather than silently falling back to — and burning — a subscription).
# It must NOT be declared under the root `secrets:` bucket: root secrets are
# also injected into `chat` sessions, where this bearer would outrank the
# subscription login and disable the session's connectors — config.yml
# rejects it there with a migration note.
workers:
  <common>:
    timeout: 30m
    concurrency: 1
    secrets:
      ANTHROPIC_AUTH_TOKEN:
        description: short-lived Anthropic bearer for the worker agent (supplied machine-side)
  implement:
    prompt: |
      You are an implementer. Make the change described in the task and run the
      project's tests. Keep the change minimal and focused.
