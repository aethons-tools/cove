name: gate

# The merge gate for main: every PR must pass this before it can be merged, and
# the post-merge commit on main is verified too. Branch protection (configured
# in repo settings, not here) is what makes it blocking; this workflow only
# reports.
#
# Scope: the hermetic checks only — `go test ./...` and scripts/lint.sh. The
# real-ssh integration suite is deliberately out (it is tracked separately).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same PR, but never skip a commit on main:
# each one must be verified on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # NOTE: this job's name ("gate") is what branch protection lists as the
  # required status check. Renaming it silently un-gates main — protection goes
  # on waiting for a check that no longer reports — so only rename it together
  # with the branch-protection setting.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # scripts/lint.sh skips shellcheck/hadolint when they are absent, so a
      # runner without them would pass this gate having linted nothing. Install
      # both, then run with STRICT=1 so a missing linter is a hard failure
      # rather than a silent skip.
      - name: Install linters
        env:
          # hadolint pin. Renovate keeps this in lockstep with the copies in
          # scripts/setup-test-tools.sh and images/jam-studio/Dockerfile (one
          # customManager watches all three), so image/CI/local never drift.
          HADOLINT_VERSION: v2.15.1
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/vscode/package-lock.json
      # The Jam app (web/app): the bundle (npm ci, build, size budget) so the
      # Go tests below serve the real app, then API types current, typecheck,
      # lint and unit tests on the same install (one npm ci: the job has a
      # 10-minute limit).
      - name: app bundle
        run: ./scripts/app.sh
      - name: app checks
        run: ./scripts/app-types-check.sh && (cd web/app && npm run check)
      # The VS Code extension (web/vscode): checks, bundle and the .vsix.
      - name: vscode extension
        run: ./scripts/vscode.sh
      - uses: actions/upload-artifact@v7
        with:
          name: jam-vscode
          path: web/vscode/dist/jam.vsix

      # Mirrors `just test` — hermetic, no docker/network/ssh.
      - name: test
        run: go test ./...

      # Mirrors `just test-install` — hermetic shell test for the root install.sh
      # (stubs gh/uname, serves a local fixture release). No network/release.
      - name: installer test
        run: bash install.test.sh

      # Mirrors `just test-jam-image` — hermetic bash harness (fake docker) for
      # scripts/jam-image.sh plus the Dockerfile and release.yml wiring checks.
      - name: jam image script test
        run: bash scripts/jam-image.test.sh

      # Mirrors `just lint` — both call scripts/lint.sh, so CI and the local
      # loop cannot drift.
      - name: lint
        run: STRICT=1 ./scripts/lint.sh
