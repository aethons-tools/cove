name: gate

# The merge gate for main and release: every PR must pass this before it can be
# merged, and the post-merge commit on either branch is verified too. Branch protection (configured
# in repo settings, not here) is what makes it blocking; this workflow only
# reports.
#
# Scope: the hermetic checks only — `go test ./...` and scripts/lint.sh. The
# real-ssh integration suite is deliberately out (it is tracked separately).

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

# Supersede in-flight runs for the same PR, but never skip a commit on main or release:
# each one must be verified on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two legs run side by side — Go (tests, installer, image script, lint) and
  # web (the app's checks, the VS Code extension, the books) — and `gate` joins them.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # scripts/lint.sh skips shellcheck/hadolint when they are absent, so a
      # runner without them would pass this gate having linted nothing. Install
      # both, then run with STRICT=1 so a missing linter is a hard failure
      # rather than a silent skip.
      - name: Install linters
        env:
          # hadolint pin. Renovate keeps this in lockstep with the copies in
          # scripts/setup-test-tools.sh and images/jam-studio/Dockerfile (one
          # customManager watches all three), so image/CI/local never drift.
          HADOLINT_VERSION: v2.15.1
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      # The Jam app bundle, so the Go tests below serve the real app.
      - name: app bundle
        run: ./scripts/app.sh

      # Mirrors `just test` — hermetic, no docker/network/ssh.
      - name: test
        run: go test ./...

      # Mirrors `just test-install` — hermetic shell test for the root install.sh
      # (stubs gh/uname, serves a local fixture release). No network/release.
      - name: installer test
        run: bash install.test.sh

      # Mirrors `just test-jam-image` — hermetic bash harness (fake docker) for
      # scripts/jam-image.sh plus the Dockerfile and release.yml wiring checks.
      - name: jam image script test
        run: bash scripts/jam-image.test.sh

      # Mirrors `just test-release-pr-body` — hermetic (temp git repo) test for
      # the release PR description script.
      - name: release PR body test
        run: bash scripts/release/pr-body.test.sh

      # Mirrors `just test-release-legs` — the legs fan-out release.yml and
      # release-pr.yml share.
      - name: release legs test
        run: bash scripts/release/legs.test.sh

      # Mirrors `just test-local` — hermetic (fake docker) test for scripts/local.sh.
      - name: local build script test
        run: bash scripts/local.test.sh

      # Mirrors `just test-docs-audit` — the docs-audit skill's checker
      # (studio-image payload) on temp docs trees, Markdown and AsciiDoc.
      - name: docs-audit checker test
        run: python3 images/jam-studio-base/docs_audit_test.py

      # Mirrors `just lint` — both call scripts/lint.sh, so CI and the local
      # loop cannot drift.
      - name: lint
        run: STRICT=1 ./scripts/lint.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The books' Vale step diffs HEAD against its first parent: on a
          # pull request, HEAD is the merge into the base, so that is what
          # the pull request changes; on a push, what the commit changed.
          fetch-depth: 2

      # The API types check generates them from Go (tygo).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/vscode/package-lock.json
            manual/package-lock.json
      # The Jam app (web/app): API types current, typecheck, lint and unit
      # tests. scripts/npm-ci.sh installs web/app once for this and the
      # extension's webview build below.
      - name: app checks
        run: ./scripts/app-types-check.sh && (cd web/app && ../../scripts/npm-ci.sh && npm run check)
      # The VS Code extension (web/vscode): checks, bundle and the .vsix.
      - name: vscode extension
        run: ./scripts/vscode.sh
      # The user manual's Antora extensions (manual/extensions) and the docs
      # converter (manual/tools/docs-to-adoc.js) tests.
      - name: manual extension tests
        run: cd manual && ../scripts/npm-ci.sh && npm test
      # The customer manual jam embeds: a leak of internal content, or any
      # warning, fails it. Built outside the tree (not into internal/jam/uiassets),
      # with the pinned headless Chrome its diagrams render with.
      - name: customer manual
        run: |
          JAM_BROWSER="$(scripts/manual-browser.sh)"
          export JAM_BROWSER
          cd manual && npx antora antora-playbook.jam.yml --to-dir "$RUNNER_TEMP/manual"
      # Mirrors `just vale`, on the pages under manual/ and docs/ this change
      # touches: Vale with the Google and Jam styles (.vale.ini), pinned and
      # sha256-verified by scripts/vale.sh. Errors fail it; warnings are
      # reported. Then the Jam style's own test.
      # The pinned Asciidoctor.js CLI Vale reads AsciiDoc through doesn't run
      # on Node 26 (its yargs loads as an ES module), so this step, the leg's
      # last, runs on Node 22, as the studio kit does.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Not into release (the release PR, and the merge's push): its diff is
      # every page since the last release, each already checked on its way
      # into main, so it would re-lint pages main's cleanup hasn't reached.
      - name: books prose (Vale)
        if: github.base_ref != 'release' && github.ref_name != 'release'
        run: ./scripts/vale.sh --changed HEAD^1
      # The test needs the pinned Vale and asciidoctor, which the step above
      # installs; into release it is skipped, so install them here (--which).
      - name: Jam Vale style test
        run: ./scripts/vale.sh --which >/dev/null && bash scripts/vale.test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: jam-vscode
          path: web/vscode/dist/jam.vsix

  # NOTE: this job's name ("gate") is what branch protection lists as the
  # required status check. Renaming it silently un-gates main — protection goes
  # on waiting for a check that no longer reports — so only rename it together
  # with the branch-protection setting. It passes only when both legs passed
  # (always() so a failed leg still reports a failed gate, not a skipped one).
  gate:
    needs: [go, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: both legs passed
        env:
          GO_LEG: ${{ needs.go.result }}
          WEB_LEG: ${{ needs.web.result }}
        run: |
          echo "go: $GO_LEG, web: $WEB_LEG"
          test "$GO_LEG" = success && test "$WEB_LEG" = success
