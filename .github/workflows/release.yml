name: release

# Monolithic continuous-delivery pipeline (COV-44, spec §3/§5/§6). ONE workflow
# on every push to main decides — from the repo diff — which artifacts to
# (re)build and publish, in DAG order (spec §3, no cycle):
#
#   jam-studio-base ──publish──► digest D ──► (registry) ──► blessed-list snapshot
#         │                                                        │
#         ▼                                                        ▼
#   jam-studio (FROM jam-studio-base:ci)                  jam (embeds jam-studio-agent + list)
#                                                                │
#                                                                ▼
#                                                         jam image (alpine + that binary)
#
# Pull requests build + smoke the touched legs but NEVER publish (spec §5).
# Versioning is <N>-<MMDD>, N = git rev-list --count HEAD (spec §5). Supersedes
# build-images.yml + the goreleaser-on-tags release + release-validate.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Serialize main (each push may publish); let a PR's own reruns cancel.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # gh cuts the release + its <N>-<MMDD> tag
  packages: write # GHCR push (also grants the read gen-blessed needs)
  pull-requests: read # paths-filter reads the PR's changed-files list

env:
  BASE_IMAGE: ghcr.io/aethons-tools/jam-studio-base
  STUDIO_IMAGE: ghcr.io/aethons-tools/jam-studio
  JAM_IMAGE: ghcr.io/aethons-tools/jam

jobs:
  # Decide, from the push/PR diff, which DAG legs run — and stamp the version.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.legs.outputs.base }} # rebuild+publish jam-studio-base
      studio_image: ${{ steps.legs.outputs.studio_image }} # (re)build jam-studio
      binaries: ${{ steps.legs.outputs.binaries }} # re-cut the host binary (+ blessed list)
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # rev-list --count + paths-filter's base diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - 'images/jam-studio-base/**'
            studio_image:
              - 'images/jam-studio/**'
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.goreleaser.yaml'
              - 'scripts/stage-studio-agent.sh'
              - 'scripts/app.sh'
              - 'web/vscode/**' # the VS Code extension .vsix jam embeds (and the release attaches)
              - 'scripts/vscode.sh'
              - 'scripts/stage-vscode.sh' # ... staged into jam, which embeds it
              - 'web/app/**' # the Jam app bundle jam embeds
              - 'install.sh' # embedded in jam (`update`)
              - 'scripts/release/**' # the archive check
              - 'images/jam/**' # the Jam container image built in the binaries leg
              - 'scripts/jam-image.sh' # ... and the script that builds it
      - id: legs
        # Fan the raw path filters into the DAG's legs (spec §3):
        #   base change     => rebuild base AND jam-studio (downstream) AND the binaries
        #                      (new digest => new DefaultRef + blessed-list head).
        #   jam-studio only => jam-studio only (FROM the current published base).
        #   go change       => the binaries only (blessed list recomputed from the head).
        env:
          BASE: ${{ steps.filter.outputs.base }}
          STUDIO: ${{ steps.filter.outputs.studio_image }}
          GO: ${{ steps.filter.outputs.go }}
        run: |
          base=false; studio=false; binaries=false
          if [ "$BASE" = 'true' ]; then base=true; fi
          if [ "$BASE" = 'true' ] || [ "$STUDIO" = 'true' ]; then studio=true; fi
          if [ "$BASE" = 'true' ] || [ "$GO" = 'true' ]; then binaries=true; fi
          {
            echo "base=$base"
            echo "studio_image=$studio"
            echo "binaries=$binaries"
          } >>"$GITHUB_OUTPUT"
      - id: version
        # <N>-<MMDD>: N (git rev-list --count HEAD) is the monotonic version; the
        # month-day is advisory; '-' (not '.') so it is never mistaken for SemVer.
        run: echo "version=$(git rev-list --count HEAD)-$(date -u +%m%d)" >>"$GITHUB_OUTPUT"

  # Build the image tree for the touched legs, smoke-test natively per arch, and —
  # on main — push per-arch tags the publish job merges. Runs whenever jam-studio
  # is (re)built, which subsumes a base rebuild (base => jam-studio downstream).
  images:
    needs: changes
    if: needs.changes.outputs.studio_image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Login on PRs too: a jam-studio-only change pulls the (private) published
      # base below. The actual push of built images stays main-only (guarded).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provide jam-studio-base:ci for the jam-studio build. Rebuild it from source
      # when the base changed; else pull the current published base so a
      # jam-studio-only change does NOT republish the base (spec §3).
      - name: Prepare base image
        run: |
          if [ "${{ needs.changes.outputs.base }}" = 'true' ]; then
            # On failure, surface the build's tail as annotations: they are
            # readable through the checks API where the raw log may not be.
            if ! docker build --progress=plain --tag jam-studio-base:ci images/jam-studio-base > /tmp/base-build.log 2>&1; then
              # (GitHub keeps 10 error annotations per step: one for the tail.)
              echo "::error title=base image build::$(grep -E 'E: |ERROR' /tmp/base-build.log | tail -n 15 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
              # A pinned apt version gone from the archive is the usual cause:
              # list each missing package's current candidate.
              pkgs=$(grep -o "for '[^']*' was not found" /tmp/base-build.log | cut -d"'" -f2 | sort -u | tr '\n' ' ')
              if [ -n "$pkgs" ]; then
                from=$(sed -n 's/^FROM //p' images/jam-studio-base/Dockerfile | head -1)
                out=$(docker run --rm "$from" sh -c "apt-get update -qq >/dev/null 2>&1; apt-cache policy $pkgs" 2>&1 || true)
                echo "::error title=apt candidates::$(printf '%s\n' "$out" | grep -E '^[^ ].*:$|Candidate:' | sed 's/^ *//' | paste - - | sed ':a;N;$!ba;s/\n/%0A/g')"
              fi
              exit 1
            fi
          else
            docker pull "${BASE_IMAGE}:latest"
            docker tag  "${BASE_IMAGE}:latest" jam-studio-base:ci
          fi

      - name: Build jam-studio
        run: docker build --build-arg BASE_TAG=ci --tag jam-studio:ci images/jam-studio

      # Every expected tool must resolve inside the image, on a native runner,
      # BEFORE anything is published.
      - name: Smoke-test jam-studio
        run: |
          docker run --rm jam-studio:ci bash -euo pipefail -c '
            echo "arch: $(uname -m)"
            go version
            just --version
            shellcheck --version | head -n2
            hadolint --version
            # code-server (built-in Studio IDE) from jam-studio-base.
            code-server --version
            # Go agent skills (samber/cc-skills-golang) seeded into the skills set.
            test -f /home/agent/.init-agent-data/skills/golang-how-to/SKILL.md
            test -f /usr/share/doc/cc-skills-golang/LICENSE
            # Agent docs/skills seeded by jam-studio-base (COV-246), agent-owned.
            seed=/home/agent/.init-agent-data
            for f in CLAUDE.md SANDBOX.md .refresh reference/progressive-disclosure.md skills/docs-audit/SKILL.md; do
              test -f "$seed/$f"
            done
            test -x "$seed/skills/docs-audit/scripts/docs_audit.py"
            test "$(stat -c %U "$seed/CLAUDE.md")" = agent
          '

      # main only: push this arch's smoke-tested image(s) under an intermediate
      # per-arch tag; the publish job merges them into the multi-arch manifests.
      - name: Push per-arch images
        if: github.event_name == 'push'
        run: |
          sha="${GITHUB_SHA::7}"
          if [ "${{ needs.changes.outputs.base }}" = 'true' ]; then
            docker tag  jam-studio-base:ci "${BASE_IMAGE}:sha-${sha}-${{ matrix.arch }}"
            docker push                    "${BASE_IMAGE}:sha-${sha}-${{ matrix.arch }}"
          fi
          docker tag  jam-studio:ci "${STUDIO_IMAGE}:sha-${sha}-${{ matrix.arch }}"
          docker push               "${STUDIO_IMAGE}:sha-${sha}-${{ matrix.arch }}"

  # main only: assemble the per-arch tags into one multi-arch manifest per built
  # image, tagged <N>-<MMDD> (immutable) + latest (moving). Publishes the base
  # FIRST so its new digest D is in the registry before the binaries leg's
  # blessed-list snapshot runs.
  publish-images:
    needs: [changes, images]
    if: github.event_name == 'push' && needs.changes.outputs.studio_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          sha="${GITHUB_SHA::7}"
          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          images=("${STUDIO_IMAGE}")
          if [ "$BASE" = 'true' ]; then images=("${BASE_IMAGE}" "${STUDIO_IMAGE}"); fi
          for image in "${images[@]}"; do
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              --tag "${image}:latest" \
              "${image}:sha-${sha}-amd64" \
              "${image}:sha-${sha}-arm64"
            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
            echo "${image}:${VERSION} -> ${digest}"
            echo "- \`${image}:${VERSION}\` @ \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # Re-cut the host binary (jam-studio-agent embedded + the blessed-list snapshot). Ordered
  # AFTER publish-images so a freshly-published base digest is already the registry
  # head when gen-blessed (a goreleaser before-hook) snapshots the blessed list.
  # PRs build + validate only; main builds a snapshot and cuts the GH release.
  # One-time re-cut of the blessed bases under the jam name (jam-only slice 3):
  # copy every released cove-base-image from the blessed watermark onward into
  # jam-studio-base with digests preserved, so the provenance gate and the
  # blessed-list snapshot resolve under the new repo. Idempotent: skipped once
  # the watermark digest resolves in jam-studio-base. It copies only images
  # already published (never a PR's build), so it runs on PRs too — the PR's
  # binaries leg needs it. Removable once the re-cut has run on main.
  recut-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the blessed bases into jam-studio-base
        env:
          OLD: ghcr.io/aethons-tools/cove-base-image
          NEW: ghcr.io/aethons-tools/jam-studio-base
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          crane=$(go env GOPATH)/bin/crane
          wm=$(grep -v '^#' internal/basedigest/blessed/watermark.txt | grep sha256 | head -1)
          if $crane manifest "$NEW@$wm" >/dev/null 2>&1; then
            echo "watermark $wm already in $NEW: nothing to copy"; exit 0
          fi
          wmtag=""
          for t in $($crane ls "$OLD"); do
            case "$t" in *[!0-9-]*|*-*-*) continue;; esac
            [ "$($crane digest "$OLD:$t")" = "$wm" ] && { wmtag=$t; break; }
          done
          [ -n "$wmtag" ] || { echo "no release tag of $OLD carries the watermark $wm"; exit 1; }
          floor=${wmtag%%-*}
          echo "watermark tag $wmtag (N=$floor)"
          copied=0
          for t in $($crane ls "$OLD" | sort -t- -k1,1n); do
            case "$t" in latest) ;; *[!0-9-]*|*-*-*) continue;; *) [ "${t%%-*}" -ge "$floor" ] || continue;; esac
            d=$($crane digest "$OLD:$t")
            $crane copy "$OLD@$d" "$NEW:$t"
            got=$($crane digest "$NEW:$t")
            [ "$got" = "$d" ] || { echo "digest changed for $t: $got != $d"; exit 1; }
            echo "copied $t -> $d"; copied=$((copied+1))
          done
          $crane manifest "$NEW@$wm" >/dev/null
          echo "copied $copied tag(s); watermark present in $NEW"

  binaries:
    needs: [changes, images, publish-images, recut-bases]
    # Run when the binaries leg is selected and nothing upstream failed. On PRs and
    # go-only main pushes the image jobs are skipped (not failed), so still run.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.binaries == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser wants full history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Jam app bundle (a goreleaser before-hook) needs Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/vscode/package-lock.json

      # Config sanity (absorbs the old release-validate workflow).
      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # PR: build the release archives exactly as main does (+ run the
      # stage-studio-agent / gen-blessed before-hooks) to prove the release builds;
      # never publish (snapshot mode skips goreleaser's publishing; --skip=publish
      # makes that explicit). The next step checks the archives.
      - name: Build binaries (PR — no publish)
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          # The gate already ran the extension's typecheck and tests on this
          # commit; the before-hook (scripts/stage-vscode.sh) only packages it.
          VSCODE_SKIP_CHECK: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main: snapshot build → archives + checksums stamped <N>-<MMDD> (snapshot
      # mode skips goreleaser's own publishing, sidestepping its SemVer tag
      # assumption); the next step cuts the release.
      - name: Build binaries (main)
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          # The gate already ran the extension's typecheck and tests on this
          # commit; the before-hook (scripts/stage-vscode.sh) only packages it.
          VSCODE_SKIP_CHECK: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every archive must hold exactly jam and jam-studio-manager — on the PR
      # before merge and on main before the release is cut.
      - name: Check release archives
        run: bash scripts/release/check-archive.sh dist

      # The VS Code extension, stamped with the release version: the .vsix the
      # goreleaser before-hook built and jam embeds (scripts/stage-vscode.sh),
      # so the release asset is the very file Jam serves. PRs prove it was
      # staged; main attaches it to the release.
      - name: VS Code extension
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: cp internal/jam/vscodeext/vsix/jam.vsix "dist/jam-vscode_${VERSION}.vsix"

      # The Jam container image is built FROM the binaries goreleaser just put in
      # dist/ (scripts/jam-image.sh), so it carries exactly the released jam and
      # its tag is the release version.
      # QEMU only for main's arm64 half; a PR builds amd64 natively.
      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v4

      # PR: build the amd64 image into the local daemon and smoke it; never publish.
      - name: Build Jam image (PR — load, no push)
        if: github.event_name == 'pull_request'
        run: bash scripts/jam-image.sh --platforms linux/amd64 --tag jam:ci

      - name: Smoke-test Jam image (PR)
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          out="$(docker run --rm jam:ci version)"
          echo "$out"
          test "$out" = "jam $VERSION"

      # main: publish the multi-arch image as <N>-<MMDD> + latest.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Jam image (main)
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          bash scripts/jam-image.sh --platforms linux/amd64,linux/arm64 \
            --tag "${JAM_IMAGE}:${VERSION}" --tag "${JAM_IMAGE}:latest" --push
          echo "Image: ${JAM_IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # The arm64 half of the manifest was only cross-built; run it under QEMU.
      - name: Smoke-test Jam image (arm64, main)
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          out="$(docker run --rm --platform linux/arm64 "${JAM_IMAGE}:${VERSION}" version)"
          echo "$out"
          test "$out" = "jam $VERSION"

      - name: Publish release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Continuous release from ${GITHUB_SHA::7} (jam + jam-studio-manager; jam-studio-agent embedded)." \
            --target "$GITHUB_SHA" \
            dist/jam_*.tar.gz dist/checksums.txt dist/jam-vscode_*.vsix
          echo "## Released \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
