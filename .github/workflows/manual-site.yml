name: manual-site

# Builds the team site, "Jam books" (the manual and the architecture book,
# docs/: release as Released, main as Next, goal as Goal; the process book from aethons-tools/jam-config: main as
# current, goal as goal; internal content shown) and deploys it to Cloudflare
# Pages. The deployed site INCLUDES INTERNAL CONTENT and is safe only because Cloudflare Access gates it:
# never remove the Access policy (it must cover the production host
# aethons-tools-jam.pages.dev, not just preview deployments), and never deploy
# the customer playbook here. See docs/modules/ROOT/pages/manual.adoc. Secret CLOUDFLARE_API_TOKEN and
# repository variable CLOUDFLARE_ACCOUNT_ID are required. Secret
# JAM_CONFIG_DEPLOY_KEY (a read-only deploy key of aethons-tools/jam-config)
# adds the process book (docs/modules/ROOT/pages/manual-books.adoc); without it the site has
# no process book, with a warning.

on:
  push:
    branches: [release, main, goal]
  workflow_dispatch:

concurrency:
  group: manual-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manual-site:
    # A manual dispatch from any other branch must not publish.
    if: contains(fromJSON('["release","main","goal"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Whether the process book can be pulled in (steps below).
      HAS_JAM_CONFIG: ${{ secrets.JAM_CONFIG_DEPLOY_KEY != '' }}
    steps:
      # main's playbook, UI and extensions build the site whichever branch
      # pushed; each version's content still comes from its own branch.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Antora reads the local branch of each name, else origin's. Make sure
      # origin's are all present; a branch that does not exist yet (release,
      # goal) is skipped by Antora, so the first runs still build.
      - name: Fetch the manual branches
        run: |
          for b in release main goal; do
            git fetch origin "+refs/heads/$b:refs/remotes/origin/$b" || echo "no origin/$b yet; skipped"
          done

      # The process book lives in the private aethons-tools/jam-config. Antora's
      # git can't do SSH, so it reads a clone inside the workspace
      # (manual/extensions/books.js, via JAM_CONFIG_DIR): the local branch of
      # each name, else origin's. fetch-depth 0 fetches every branch to
      # origin/*, so origin's main and goal are there (main also checked out);
      # a branch that doesn't exist yet (goal) is skipped. The key isn't kept
      # (persist-credentials: false): npm ci runs third-party code next.
      - name: No process book
        if: env.HAS_JAM_CONFIG != 'true'
        run: echo "::warning::JAM_CONFIG_DEPLOY_KEY is not set; deploying without the process book"

      - uses: actions/checkout@v7
        if: env.HAS_JAM_CONFIG == 'true'
        with:
          repository: aethons-tools/jam-config
          ref: main
          ssh-key: ${{ secrets.JAM_CONFIG_DEPLOY_KEY }}
          path: jam-config
          fetch-depth: 0
          persist-credentials: false

      - name: Point the build at jam-config
        if: env.HAS_JAM_CONFIG == 'true'
        working-directory: jam-config
        run: |
          git for-each-ref --format='%(refname:short)' refs/heads/main refs/remotes/origin/main refs/remotes/origin/goal
          echo "JAM_CONFIG_DIR=$PWD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manual/package-lock.json

      # The UI bundle (antora-ui-spring), pinned and sha256-verified before
      # Antora reads it (docs/modules/ROOT/pages/manual-books.adoc).
      - name: Build the team manual
        working-directory: manual
        run: |
          ../scripts/manual-ui.sh
          ../scripts/npm-ci.sh
          npx antora antora-playbook.yml

      - name: Deploy to Cloudflare Pages
        working-directory: manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
        # Pinned here, not in manual/package.json, so manual builds never install it.
        run: npx --yes wrangler@4.158.0 pages deploy build/site --project-name aethons-tools-jam --branch main
