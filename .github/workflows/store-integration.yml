name: store-integration

# Runs the Postgres-backed harbor.Store conformance suite (the //go:build
# integration tests in internal/harbor) against a real Postgres service. Kept
# separate from the `gate` workflow so the required `gate` check is untouched;
# promoting this to a required check is a branch-protection setting, not here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  store-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Postgres store's conformance + fail-closed tests are behind the
      # `integration` build tag and skip without HARBOR_TEST_POSTGRES_DSN.
      # The intercom Postgres backend (internal/intercom/intercompg) shares the
      # same service and DSN convention.
      - name: store integration tests
        env:
          HARBOR_TEST_POSTGRES_DSN: "host=localhost port=5432 dbname=harbor user=harbor password=harbor sslmode=disable"
        run: go test -tags integration ./internal/harbor/... ./internal/intercom/... ./internal/allocator/...
