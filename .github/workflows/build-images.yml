name: build-images

# Build the shared image tree (cove-base-image → cove-image), smoke-test the
# toolchain natively per arch, and — on main only — publish both as multi-arch
# manifests to GHCR. Pull requests build + smoke but never publish (spec §5:
# only main publishes). Runs when the image definitions, the at-task source, or
# this workflow change.

on:
  pull_request:
    paths: &image_inputs
      # The image definitions themselves.
      - images/**
      # at-task is compiled from source and baked into cove-base-image, so any
      # of its inputs can change the image: its own package, every internal
      # package it imports (watch the whole tree — imports drift), and the
      # module files. `go list -deps ./cmd/at-task` today: internal/{cli,
      # dispatch/github,dispatch/worker}.
      - cmd/at-task/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/build-images.yml
  push:
    branches: [main]
    paths: *image_inputs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write # GHCR push (main only; PR runs don't reach the push steps)

env:
  BASE_IMAGE: ghcr.io/aethons-tools/cove-base-image
  COVE_IMAGE: ghcr.io/aethons-tools/cove-image

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # at-task is baked into cove-base-image; build it from source for this
      # runner's native arch and stage it into the base build context. Stamp the
      # commit so `at-task version` is traceable instead of reporting "dev".
      - name: Build at-task (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o images/cove-base-image/at-task ./cmd/at-task

      - name: Build cove-base-image
        run: docker build --tag cove-base-image:ci images/cove-base-image

      - name: Build cove-image
        run: docker build --build-arg BASE_TAG=ci --tag cove-image:ci images/cove-image

      # Every expected tool must resolve inside the image. A missing tool or a
      # bad layer fails here, on a native runner, BEFORE anything is published.
      - name: Smoke-test cove-image
        run: |
          docker run --rm cove-image:ci bash -euo pipefail -c '
            echo "arch: $(uname -m)"
            go version
            just --version
            shellcheck --version | head -n2
            hadolint --version
            at-task version
            node --version
            npm --version
            chromium --version
            java -version
          '

      # main only: push this arch's smoke-tested images under an intermediate
      # per-arch tag; the publish job merges them into the multi-arch manifests.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch images
        if: github.event_name == 'push'
        run: |
          sha="${GITHUB_SHA::7}"
          docker tag cove-base-image:ci "${BASE_IMAGE}:sha-${sha}-${{ matrix.arch }}"
          docker push               "${BASE_IMAGE}:sha-${sha}-${{ matrix.arch }}"
          docker tag cove-image:ci  "${COVE_IMAGE}:sha-${sha}-${{ matrix.arch }}"
          docker push               "${COVE_IMAGE}:sha-${sha}-${{ matrix.arch }}"

  # main only: assemble the per-arch tags into one multi-arch manifest per image,
  # tagged with an immutable date+sha and a moving latest. The manifest-list
  # digest printed here is what downstream consumers (COV-34/COV-35) pin.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          sha="${GITHUB_SHA::7}"
          tag="$(date -u +%Y.%m.%d)-${sha}"
          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          for image in "${BASE_IMAGE}" "${COVE_IMAGE}"; do
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              --tag "${image}:latest" \
              "${image}:sha-${sha}-amd64" \
              "${image}:sha-${sha}-arm64"
            digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')"
            echo "${image}:${tag} -> ${digest}"
            echo "- \`${image}:${tag}\` @ \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
