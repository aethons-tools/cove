# air live-reload config for `just dev-watch` — local dev only (see dev/README.md).
# Rebuilds at-jam and restarts `at-jam serve` on source changes; air's proxy
# (http://localhost:8090) fronts the plain-HTTP admin listener and reloads the
# browser on /me and /ui after each restart. Keys match the air version pinned in
# the justfile's dev-watch recipe.
root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o .air/at-jam ./cmd/at-jam"
  # The wrapper runs .air/at-jam serve (under sudo for the :443 broker listener).
  entrypoint = ["./dev/watch-serve.sh"]
  # Templates and htmx are go:embed'ed, so UI edits need a rebuild too.
  include_ext = ["go", "html", "js", "css"]
  exclude_dir = [".air", ".git", ".gopath", ".worktrees", ".claude", ".at-cove", ".at-jam", "dist", "docs", "dev"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # false: a failed build leaves the last good binary serving (Jam stays up).
  stop_on_error = false
  send_interrupt = true
  kill_delay = "10s"

[proxy]
  enabled = true
  proxy_port = 8090
  app_port = 8081   # admin-listen's port in dev/jam.dev.yml

[misc]
  clean_on_exit = true
