# goreleaser config for the jam host binary — the BUILD tool for the binaries
# leg of the monolithic pipeline (.github/workflows/release.yml, COV-44). CI runs
# `goreleaser release --snapshot` on every main push: goreleaser builds + archives
# jam (darwin/linux × amd64/arm64) stamped <N>-<MMDD> via the VERSION env; the
# workflow then cuts the (private) GitHub release with `gh`. Snapshot mode is
# used deliberately — it skips goreleaser's own publishing, so the non-SemVer
# <N>-<MMDD> version needs no git tag to satisfy goreleaser. jam-studio-agent is
# NOT shipped standalone — it is embedded in jam (the before-hook stages the
# linux jam-studio-agent binaries first).
#
# Public phase (later): add a `brews:` block that installs jam from the single
# archive below.
version: 2

project_name: jam

# The version stamped into archives + the binary. CI exports VERSION=<N>-<MMDD>;
# a bare local `goreleaser` (no VERSION) falls back to a dev string so the config
# still evaluates.
snapshot:
  version_template: '{{ if index .Env "VERSION" }}{{ .Env.VERSION }}{{ else }}0.0.0-dev-{{ .ShortCommit }}{{ end }}'

before:
  hooks:
    # Build the linux jam-studio-agent binaries jam embeds, before goreleaser builds.
    - bash scripts/stage-studio-agent.sh
    # Build the whiteboard editor bundle jam embeds (git-ignored output, so
    # the tree stays clean). Required here: a release ships the editor.
    - bash scripts/whiteboard.sh
    # Build the Jam app bundle jam embeds (git-ignored output). Required
    # here: a release ships the app.
    - bash scripts/app.sh
    # Snapshot the blessed jam-studio-base digests from the registry into the
    # embedded (gitignored) blessed/generated.txt before jam is built (COV-44
    # spec §4). A no-op without GITHUB_TOKEN (offline embeds the committed
    # low-watermark); release.yml grants packages:read so CI picks up every current
    # base with no commit-back loop. Writing only the gitignored file keeps the
    # tree clean for goreleaser's dirty-state check.
    - go run ./cmd/gen-blessed

builds:
  - id: jam
    main: ./cmd/jam
    binary: jam
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # One archive holding exactly `jam` — what install.sh (and so `jam update`)
  # installs. `none*` matches nothing, so goreleaser adds no README/LICENSE.
  - id: jam
    ids: [jam]
    name_template: "jam_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

release:
  # Private repo → the release is private. Auto-mark pre-releases (-rc/-beta/…).
  prerelease: auto

changelog:
  use: github
