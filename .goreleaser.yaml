# goreleaser config for the cove host binaries — the BUILD tool for the at-cove
# leg of the monolithic pipeline (.github/workflows/release.yml, COV-44). CI runs
# `goreleaser release --snapshot` on every main push: goreleaser builds + archives
# at-cove + at-mint (darwin/linux × amd64/arm64) stamped <N>-<MMDD> via the VERSION
# env; the workflow then cuts the (private) GitHub release with `gh`. Snapshot mode
# is used deliberately — it skips goreleaser's own publishing, so the non-SemVer
# <N>-<MMDD> version needs no git tag to satisfy goreleaser. at-task is NOT shipped
# standalone — it is embedded in at-cove (the before-hook stages the linux at-task
# binaries first). See COV-36 + docs/superpowers/specs/2026-07-17-at-cove-release-embed-design.md.
#
# Public phase (later): add a `brews:` block that installs both at-cove and
# at-mint from the single archive below, so `brew install` yields both.
version: 2

project_name: cove

# The version stamped into archives + the binary. CI exports VERSION=<N>-<MMDD>;
# a bare local `goreleaser` (no VERSION) falls back to a dev string so the config
# still evaluates.
snapshot:
  version_template: '{{ if index .Env "VERSION" }}{{ .Env.VERSION }}{{ else }}0.0.0-dev-{{ .ShortCommit }}{{ end }}'

before:
  hooks:
    # Build the linux at-task binaries at-cove embeds, before goreleaser builds.
    - bash scripts/stage-attask.sh
    # Snapshot the blessed cove-base-image digests from the registry into the
    # embedded (gitignored) blessed/generated.txt before at-cove is built (COV-44
    # spec §4). A no-op without GITHUB_TOKEN (offline embeds the committed
    # low-watermark); release.yml grants packages:read so CI picks up every current
    # base with no commit-back loop. Writing only the gitignored file keeps the
    # tree clean for goreleaser's dirty-state check.
    - go run ./cmd/gen-blessed

builds:
  - id: at-cove
    main: ./cmd/at-cove
    binary: at-cove
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: at-mint
    main: ./cmd/at-mint
    binary: at-mint
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # One archive carrying both binaries — brew-phase installs them together.
  - id: cove
    ids: [at-cove, at-mint]
    name_template: "cove_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # Private repo → the release is private. Auto-mark pre-releases (-rc/-beta/…).
  prerelease: auto

changelog:
  use: github
